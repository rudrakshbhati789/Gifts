<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Our Reels ❤️</title>
<style>
body{
  background:#000;
  color:white;
  font-family:Poppins;
}
.reel{
  background:#111;
  margin:15px;
  padding:15px;
  border-radius:15px;
}
a{
  color:#ff4da6;
  text-decoration:none;
  font-size:16px;
}
.add{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff4da6;
  padding:15px;
  border-radius:50%;
  font-size:22px;
}
</style>
</head>
<body>

<h2 style="text-align:center;">❤️ Our Reels ❤️</h2>

<div id="list"></div>

<a class="add" href="add.html">＋</a>

<script>
let reels=JSON.parse(localStorage.getItem("reels")||"[]");
let list=document.getElementById("list");

reels.forEach(r=>{
  let d=document.createElement("div");
  d.className="reel";
  d.innerHTML=`<a href="${r}" target="_blank">▶ Open Reel</a>`;
  list.appendChild(d);
});
</script>

</body>
</html>
