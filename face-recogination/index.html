<!DOCTYPE html>
<html>
<head>
<title>Face Scan Login</title>
<style>
body{
    margin:0;
    background:#000;
    font-family: Arial;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

/* FACE SCAN FRAME */
.scan-box{
    width:300px;
    height:350px;
    border:3px solid #ff48b8;
    box-shadow:0 0 25px #ff48b8;
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* SCAN LINE ANIMATION */
.scan-line{
    width:100%;
    height:4px;
    background:#ff48b8;
    position:absolute;
    top:0;
    animation:move 2s linear infinite;
}
@keyframes move{
    0%{ top:0; }
    100%{ top:346px; }
}

/* TEXT */
.title{
    margin-bottom:15px;
    font-size:25px;
    text-shadow:0 0 10px #ff48b8;
}

/* BUTTON */
#unlockBtn{
    margin-top:15px;
    padding:10px 22px;
    font-size:18px;
    border:none;
    color:white;
    background:#ff48b8;
    border-radius:8px;
    cursor:pointer;
    display:none;
    transition:0.3s;
}
#unlockBtn:hover{
    transform:scale(1.08);
    box-shadow:0 0 15px #ff48b8;
}
</style>
</head>
<body>

<div class="title">Scanning Face…</div>

<div class="scan-box" id="box">
    <div class="scan-line"></div>
</div>

<h3 id="status">Detecting face…</h3>

<button id="unlockBtn" onclick="openPage()">Unlock</button>

<script>
// SIMULATED FACE RECOGNITION SYSTEM
let faces = ["rudra", "biwi"];  // Allowed faces

// Random result like real recognition
setTimeout(()=>{
    document.getElementById("status").innerText = 
        "Face matched: " + faces[Math.floor(Math.random()*faces.length)];

    document.getElementById("unlockBtn").style.display = "block";
}, 3000);

// On unlock
function openPage(){
    window.location.href = "next.html"; // yaha apni file lagao
}
</script>

</body>
</html>
