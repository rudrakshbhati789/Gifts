<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalo Biwi Padhai Karenge 💖</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
    --bg-color: #ffe6f0;
    --pink: #ff66b3;
    --gold: #ffb347;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Playfair Display', serif;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
}

h1 {
    font-size: 2.5rem;
    color: var(--pink);
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 0 15px var(--pink), 0 0 25px var(--gold);
}

.btn-start {
    padding: 15px 40px;
    font-size: 1.2rem;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    background: linear-gradient(to right, var(--pink), var(--gold));
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
}
.btn-start:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px rgba(255,102,179,0.6);
}

/* Floating hearts background */
.heart-bg {
    position: fixed;
    top:0; left:0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}
.heart-bg span {
    position: absolute;
    font-size: 24px;
    animation: floatUp 8s linear infinite;
    opacity: 0.8;
    color: var(--pink);
}
@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.6); opacity:0; }
    20% { opacity:1; }
    100% { transform: translateY(-10vh) scale(1.2); opacity:0; }
}

@media(max-width:480px){
    h1 { font-size: 1.8rem; margin-bottom: 25px; }
    .btn-start { padding: 12px 30px; font-size: 1rem; }
}
</style>
</head>
<body>

<div class="heart-bg" id="heart-bg"></div>

<h1>Chalo Biwi, Padhai Karenge 📖💖</h1>
<button class="btn-start" onclick="window.location.href='/ann/qr.html'">Start Padhai ➡</button>

<script>
// Floating hearts
const heartContainer = document.getElementById("heart-bg");
for(let i=0;i<25;i++){
    let span = document.createElement("span");
    span.innerText = "💖";
    span.style.left = Math.random()*100 + "vw";
    span.style.animationDuration = 5 + Math.random()*5 + "s";
    span.style.fontSize = 16 + Math.random()*25 + "px";
    span.style.animationDelay = Math.random()*5 + "s";
    heartContainer.appendChild(span);
}
</script>

</body>
</html>
