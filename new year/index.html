<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Wife ❤️</title>
<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ff5f9e,#ffc371);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Poppins,sans-serif;
  color:white;
  padding:10px;
  overflow:hidden;
}

/* Card / box */
.box{
  background:rgba(255,255,255,0.2);
  padding:clamp(20px,5vw,40px);
  border-radius:25px;
  text-align:center;
  max-width:400px;
  width:90%;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
  backdrop-filter:blur(10px);
  position:relative;
  z-index:1;
}

/* Heading */
h2{
  font-size:clamp(1.5rem,6vw,2.5rem);
  margin-bottom:15px;
  font-weight:600;
}

/* Input */
input{
  padding:clamp(10px,2.5vw,14px);
  width:80%;
  max-width:300px;
  border:none;
  border-radius:25px;
  text-align:center;
  font-size:clamp(0.9rem,3vw,1.1rem);
}

/* Button */
button{
  margin-top:15px;
  padding:clamp(10px,2vw,14px) clamp(20px,5vw,30px);
  border:none;
  border-radius:25px;
  background:white;
  color:#ff4f81;
  font-size:clamp(0.9rem,3vw,1.1rem);
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
  transition:0.3s;
}
button:hover{
  transform:scale(1.05);
}

/* Message */
#msg{
  margin-top:12px;
  font-size:clamp(0.85rem,3vw,1rem);
  color:#fff2f2;
}

/* Floating hearts */
.heart{
  position:fixed;
  font-size:clamp(16px,4vw,26px);
  animation:float 4s linear infinite;
  pointer-events:none;
}

/* Sparkle effect */
.sparkle{
  position:fixed;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0.8;
  pointer-events:none;
  animation:sparkleAnim 2s linear infinite;
}

@keyframes float{
  0%{bottom:0;opacity:1;transform:translateX(0)}
  100%{bottom:100vh;opacity:0;transform:translateX(30px)}
}

@keyframes sparkleAnim{
  0%{transform:scale(1) translateY(0);}
  50%{transform:scale(1.5) translateY(-50px);}
  100%{transform:scale(0) translateY(-100px);}
}
</style>
</head>
<body>

<div class="box">
  <h2>❤️ Enter My Wife's Name ❤️</h2>
  <input id="pass" placeholder="Her name">
  <br>
  <button onclick="check()">Open Gift 🎁</button>
  <p id="msg"></p>
</div>

<script>
// Password check
function check(){
  if(document.getElementById("pass").value.toLowerCase()=="biwi"){
    window.location="/new year/love.html";
  }else{
    document.getElementById("msg").innerText="❌ Only my queen can open this";
  }
}

// Floating hearts
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(Math.random()*20+16)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
},300);

// Sparkles
setInterval(()=>{
  const s=document.createElement("div");
  s.className="sparkle";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.width=(Math.random()*4+2)+"px";
  s.style.height=s.style.width;
  s.style.opacity=Math.random()*0.7+0.3;
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),2000);
},200);
</script>

</body>
</html>
