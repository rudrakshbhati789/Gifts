<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Chat 💬</title>

<link rel="stylesheet" href="/romantic-os/css/style.css">

<style>
/* ===== CHAT RESPONSIVE FIX (ADD ONLY) ===== */

html, body {
  height: 100%;
}

body.app-bg{
  display:flex;
  flex-direction:column;
  height:100dvh;
  overflow:hidden;
}

/* chat scroll area */
.chat-container{
  flex:1;
  overflow-y:auto;
  padding:10px;
  -webkit-overflow-scrolling:touch;
}

/* input bar */
.chat-input{
  display:flex;
  gap:6px;
  padding:8px;
  flex-shrink:0;
}

/* inputs fix */
.chat-input input{
  flex:1;
  min-width:0;        /* 🔥 overflow FIX */
}

/* button fix */
.chat-input button{
  flex-shrink:0;
}

/* small phones */
@media(max-width:480px){
  .chat-input{
    flex-wrap:wrap;
  }
  #username{
    width:100%;
  }
}
</style>
</head>

<body class="app-bg">

<!-- TOP BAR -->
<div class="status-bar glass">
  <span>💬 Love Chat</span>
  <span onclick="history.back()">⬅ Back</span>
</div>

<!-- CHAT -->
<div class="chat-container" id="chatBox"></div>

<!-- INPUT -->
<div class="chat-input">
  <input id="username" placeholder="Your name ❤️">
  <input id="messageInput" placeholder="Type love message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/romantic-os/js/chat.js"></script>

<script>
/* 🔥 keyboard safe height fix */
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",()=>{
    document.body.style.height =
      window.visualViewport.height + "px";
  });
}
</script>

</body>
</html>
