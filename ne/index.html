<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forever Us 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#ff5fa2,#ff9bd1,#ffd1e8);color:#fff;overflow:hidden}
section{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.card{background:rgba(255,255,255,.2);backdrop-filter:blur(12px);border-radius:26px;padding:26px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{margin:10px 0}
input{padding:12px;border:none;border-radius:12px;width:80%;text-align:center}
button{margin:10px;padding:12px 18px;border:none;border-radius:14px;background:#fff;color:#ff4d9a;font-weight:700;font-size:15px;cursor:pointer}
.msg{font-size:15px;line-height:1.6;margin:14px 0}

/* Hearts */
.heart{position:absolute;bottom:-20px;font-size:20px;animation:rise linear forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-120vh) scale(1.6);opacity:0}}

/* Slideshow */
.slideshow{width:100%;height:220px;border-radius:18px;overflow:hidden;margin-bottom:10px}
.slideshow img{width:100%;height:100%;object-fit:cover;display:none}
.slideshow img.active{display:block}

/* Fireworks */
canvas{position:fixed;top:0;left:0;pointer-events:none}

/* Camera */
video,canvas#snap{width:100%;border-radius:16px;margin-top:10px}

.no{background:#ffd1e8;color:#ff2d7a;position:relative}
</style>
</head>
<body>

<audio id="bgm" src="music.mp3" loop></audio>
<canvas id="fire"></canvas>

<!-- PASSWORD LOCK -->
<section id="lock">
  <div class="card">
    <h1>🔒 Private Love</h1>
    <p class="msg">Enter your name to unlock 💖</p>
    <input id="pass" placeholder="Her name" />
    <br>
    <button onclick="unlock()">Unlock ✨</button>
  </div>
</section>

<!-- PAGE 1 -->
<section id="page1" style="display:none">
  <div class="card">
    <h1>Ishika 💕</h1>

    <div class="slideshow">
      <img src="m1.jpg" class="active">
      <img src="m2.jpg">
      <img src="m3.jpg">
    </div>

    <p class="msg" id="typeText"></p>

    <h3>💋 Kiss Counter: <span id="kiss">0</span></h3>
    <button onclick="kiss()">Send Kiss 😘</button>

    <button onclick="goProposal()">Next Surprise 💫</button>
  </div>
</section>

<!-- PAGE 2 -->
<section id="page2" style="display:none">
  <div class="card">
    <h1>Will You Be Mine Forever? 💍</h1>
    <p class="msg">Tum meri duniya ho ❤️</p>

    <button onclick="yesLove()">YES 💖</button>
    <button class="no" onmouseover="moveNo(this)">NO 🙈</button>

    <video id="video" autoplay></video>
    <button onclick="snap()">📸 Take Selfie</button>
    <canvas id="snap"></canvas>
  </div>
</section>

<script>
const music=document.getElementById('bgm');
document.body.addEventListener('click',()=>music.play(),{once:true});

/* PASSWORD */
function unlock(){
  if(document.getElementById('pass').value.toLowerCase()==='ishika'){
    lock.style.display='none';page1.style.display='flex';type();
  } else alert('Wrong name 😛');
}

/* TYPE */
const text="Bubuuu 💖, tum mere har sapne ka sabse khoobsurat hissa ho. Main tumse bepanah pyaar karta hoon.";
let i=0;
function type(){if(i<text.length){typeText.innerHTML+=text.charAt(i++);setTimeout(type,60)}}

/* SLIDESHOW */
let s=0;const slides=document.querySelectorAll('.slideshow img');
setInterval(()=>{slides[s].classList.remove('active');s=(s+1)%slides.length;slides[s].classList.add('active')},2500);

/* KISS COUNTER */
let k=0;function kiss(){kiss.innerText=++k;burst()}

function goProposal(){page1.style.display='none';page2.style.display='flex';startCam()}

/* YES */
function yesLove(){fireworks();burst();alert('She said YES 💖🥹')}

/* NO */
function moveNo(b){b.style.left=Math.random()*200+'px';b.style.top=Math.random()*200+'px'}

/* HEARTS */
function burst(){for(let i=0;i<20;i++)setTimeout(()=>spawn(Math.random()*innerWidth,innerHeight-20),i*80)}
function spawn(x,y){const h=document.createElement('div');h.className='heart';h.textContent='💖';h.style.left=x+'px';h.style.animationDuration=(4+Math.random()*3)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),7000)}

/* CAMERA */
const v=document.getElementById('video');const c=document.getElementById('snap');
function startCam(){navigator.mediaDevices.getUserMedia({video:true}).then(s=>v.srcObject=s)}
function snap(){c.getContext('2d').drawImage(v,0,0,c.width,c.height)}

/* FIREWORKS */
const f=document.getElementById('fire'),ctx=f.getContext('2d');f.width=innerWidth;f.height=innerHeight;
function fireworks(){for(let i=0;i<100;i++){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(Math.random()*f.width,Math.random()*f.height,3,3)}}
</script>
</body>
</html>
