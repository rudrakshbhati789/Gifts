<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biwii 💖</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}
body{
 background:#0b0b0b;
 overflow:hidden;
 color:white;
}

/* ❤️ HEARTS */
.heart{
 position:fixed;
 bottom:-20px;
 font-size:18px;
 color:rgba(255,105,180,.6);
 animation:float linear infinite;
 pointer-events:none;
}
@keyframes float{
 from{transform:translateY(0) scale(1);opacity:1}
 to{transform:translateY(-110vh) scale(1.6);opacity:0}
}

/* 💖 I LOVE YOU FLOATING BG */
.loveText{
 position:fixed;
 font-size:18px;
 color:rgba(255,105,180,.4);
 animation:floatLove linear infinite;
 pointer-events:none;
}
@keyframes floatLove{
 from{transform:translateY(100vh) scale(1);opacity:1;}
 to{transform:translateY(-120vh) scale(1.5);opacity:0;}
}

/* MOVING CARD */
.card{
 position:absolute;
 width:22vw;
 max-width:130px;
 aspect-ratio:3/4;
 border-radius:18px;
 object-fit:cover;
 box-shadow:0 15px 30px rgba(255,105,180,.6);
 opacity:0;
}

/* GRID */
#grid{
 position:fixed;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
 gap:12px;
 padding:12px;
 max-height:60vh;
 overflow-y:auto;
 background:rgba(0,0,0,0.15);
 opacity:0;
 z-index:50;
}

/* VIEWER */
#viewer{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.85);
 display:none;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 z-index:99;
}
#viewer img{
 width:60vw;
 max-width:220px;
 border-radius:22px;
 box-shadow:0 0 50px hotpink;
 animation:zoom .6s ease;
}
@keyframes zoom{
 from{transform:scale(.6);opacity:0}
 to{transform:scale(1);opacity:1}
}
#text{
 margin-top:16px;
 font-size:1rem;
 border-right:2px solid pink;
 white-space:nowrap;
 overflow:hidden;
 text-align:center;
}

/* SURPRISE BUTTON */
#surpriseBtn{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 padding:12px 26px;
 font-size:1rem;
 border:none;
 border-radius:30px;
 background:linear-gradient(45deg,hotpink,deeppink);
 color:white;
 display:none;
 box-shadow:0 0 20px hotpink;
 cursor:pointer;
 z-index:100;
}

/* SURPRISE SCREEN */
#surprise{
 position:fixed;
 inset:0;
 background:radial-gradient(circle,#1a001a,#000);
 display:none;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 z-index:200;
 text-align:center;
}
#surprise h2{
 font-size:2rem;
 color:#ff9ad5;
 max-width:90%;
 line-height:1.4;
 animation:glow 1.5s infinite alternate;
}
@keyframes glow{
 from{text-shadow:0 0 10px hotpink}
 to{text-shadow:0 0 35px deeppink}
}

/* REACTIONS */
#reactionBar{
 position:fixed;
 bottom:80px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 gap:12px;
 z-index:100;
}
.reaction{
 font-size:24px;
 background:transparent;
 border:none;
 cursor:pointer;
}

/* FLOATING EMOJIS */
.floatingEmoji{
 position:fixed;
 pointer-events:none;
 animation:floatEmoji linear forwards;
}
@keyframes floatEmoji{
 0%{transform:translateY(0) scale(1);opacity:1;}
 100%{transform:translateY(-120vh) scale(1.4);opacity:0;}
}

/* MOBILE */
@media(max-width:480px){
 .card{width:28vw}
 #surprise h2{font-size:1.5rem}
 #viewer img{max-width:180px;}
}
</style>
</head>

<body>

<!-- VIEWER -->
<div id="viewer" onclick="this.style.display='none'">
 <img id="viewerImg">
 <div id="text"></div>
</div>

<!-- GRID -->
<div id="grid"></div>

<!-- SURPRISE BUTTON -->
<button id="surpriseBtn" onclick="showSurprise()">Final Surprise 💖</button>

<!-- REACTION BAR -->
<div id="reactionBar">
 <button class="reaction">❤️</button>
 <button class="reaction">😍</button>
 <button class="reaction">😂</button>
 <button class="reaction">🥰</button>
 <button class="reaction">✨</button>
</div>

<!-- SURPRISE SCREEN -->
<div id="surprise">
 <h2 id="surpriseText"></h2>
</div>

<script>
/* 🔹 DATA */
const data=[
 {img:"/imagesgift/images/2.jpeg", text:"Biwii ❤️ tum meri sabse pyari kahani ho"},
 {img:"/imagesgift/images/3.jpeg", text:"Tumhari smile mera sukoon hai"},
 {img:"/imagesgift/images/7.jpeg", text:"Tum saath ho to sab easy lagta hai"},
 {img:"/imagesgift/images/8.jpeg", text:"Is saal ka best gift tum ho"},
 {img:"/imagesgift/images/9.jpeg", text:"Tum meri aadat ban chuki ho"},
 {img:"/imagesgift/images/10.jpeg", text:"Tum ho to ghar jaisa lagta hai"},
 {img:"/imagesgift/images/11.jpeg", text:"Tum meri peace ho Biwii"},
 {img:"/imagesgift/images/12.jpeg", text:"Tumse milke zindagi badal gayi"},
 {img:"/imagesgift/images/13.jpeg", text:"Forever ka matlab tum"},
 {img:"/imagesgift/images/15.jpeg",text:"Always yours 💖"}
];

const body=document.body;
const grid=document.getElementById("grid");
const viewer=document.getElementById("viewer");
const viewerImg=document.getElementById("viewerImg");
const textBox=document.getElementById("text");
const btn=document.getElementById("surpriseBtn");
const reactionBtns=document.querySelectorAll(".reaction");

let cards=[];

/* ❤️ FLOATING HEARTS */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=3+Math.random()*4+"s";
 body.appendChild(h);
 setTimeout(()=>h.remove(),7000);
},300);

/* 💖 FLOATING I LOVE YOU */
setInterval(()=>{
 let t=document.createElement("div");
 t.className="loveText";
 t.innerHTML="I ❤️ YOU";
 t.style.left=Math.random()*90+"vw";
 t.style.fontSize=14+Math.random()*18+"px";
 t.style.animationDuration=4+Math.random()*3+"s";
 body.appendChild(t);
 setTimeout(()=>t.remove(),7000);
},400);

/* CREATE MOVING CARDS */
data.forEach((d,i)=>{
 let img=document.createElement("img");
 img.src=d.img;
 img.className="card";
 img.style.top=i%2?"55%":"30%";
 img.style.left="-160px";
 body.appendChild(img);
 cards.push(img);
});

/* STEP 1 – LEFT ➜ RIGHT */
cards.forEach((c,i)=>{
 setTimeout(()=>{
  c.style.opacity=1;
  c.style.transition="2s ease";
  c.style.left="110%";
 },i*250);
});

/* STEP 2 – RIGHT ➜ LEFT */
setTimeout(()=>{
 cards.forEach((c,i)=>{ setTimeout(()=>c.style.left="-160px",i*250); });
},3500);

/* STEP 3 – ONE BY ONE CENTER */
setTimeout(()=>{
 let i=0;
 function next(){
  if(i>=cards.length){setGrid();return;}
  let c=cards[i];
  c.style.transition="1s ease";
  c.style.left="50%";
  c.style.top=40 + i*25 + "px"; // line by line
  c.style.transform="translate(-50%,-50%) scale(0.7)";
  c.style.width="140px";
  setTimeout(()=>{
   c.style.opacity=0;
   i++;
   next();
  },1600);
 }
 next();
},7600);

/* STEP 4 – GRID */
function setGrid(){
 cards.forEach(c=>c.remove());
 data.forEach(d=>{
  let img=document.createElement("img");
  img.src=d.img;
  img.style.width="100%";
  img.style.maxWidth="90px";
  img.style.borderRadius="14px";
  img.style.margin="0 auto";
  img.onclick=()=>openViewer(d.img,d.text);
  grid.appendChild(img);
 });
 grid.style.opacity=1;
 btn.style.display="block";
}

/* VIEWER */
function openViewer(src,msg){
 viewer.style.display="flex";
 viewerImg.src=src;
 typeText(msg);
}
function typeText(msg){
 textBox.innerHTML="";
 let i=0;
 let t=setInterval(()=>{
  textBox.innerHTML+=msg[i];
  i++;
  if(i>=msg.length)clearInterval(t);
 },80);
}

/* 🎆 SURPRISE */
function showSurprise(){
 document.getElementById("surprise").style.display="flex";
 typeFinal("Biwii ❤️\nTum meri zindagi ka sabse khoobsurat surprise ho ✨\nForever & Always 💖");
}
function typeFinal(msg){
 const el=document.getElementById("surpriseText");
 el.innerHTML="";
 let i=0;
 let t=setInterval(()=>{
  el.innerHTML+=msg[i]==="\n"?"<br>":msg[i];
  i++;
  if(i>=msg.length)clearInterval(t);
 },70);
}

/* INSTAGRAM STYLE REACTIONS */
reactionBtns.forEach(btn=>{
 btn.addEventListener("click",()=>{
  let emoji=document.createElement("div");
  emoji.className="floatingEmoji";
  emoji.innerText=btn.innerText;
  emoji.style.left=Math.random()*90 + "vw";
  emoji.style.bottom="20px";
  emoji.style.fontSize=(20+Math.random()*20)+"px";
  emoji.style.animationDuration=(2+Math.random()*2)+"s";
  body.appendChild(emoji);
  setTimeout(()=>emoji.remove(),4000);
 });
});
</script>

</body>
</html>
