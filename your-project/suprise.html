<!DOCTYPE html>
<html>
<head>
<title>Surprise ❤️</title>
<style>
/* Basic Reset & Body */
body {
    margin:0;
    background: linear-gradient(135deg, #0b0c10, #1f2833, #4a4e69);
    color:white;
    text-align:center;
    font-family:"Poppins", sans-serif;
    overflow:hidden;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding: 20px;
}

/* Heading with glowing animation */
h1 {
    font-size:50px;
    text-shadow: 0 0 20px #ff4fa8, 0 0 40px #ff1fb0, 0 0 60px #ff77ff;
    animation: glow 2s infinite alternate;
    margin-bottom: 20px;
}

/* Glow animation */
@keyframes glow {
    from { text-shadow: 0 0 20px #ff4fa8, 0 0 40px #ff1fb0, 0 0 60px #ff77ff; }
    to { text-shadow: 0 0 40px #ff77ff, 0 0 60px #ff4fa8, 0 0 80px #ff1fb0; }
}

/* Subtext styling */
p.typing-text {
    font-size:24px;
    max-width:700px;
    margin:10px auto;
    opacity:0;
    color: #ffd1fc;
    text-shadow: 0 0 8px #ff77ff;
}

/* Love paragraph styling */
#lovePara {
    font-size:22px;
    max-width:700px;
    margin:20px auto;
    color: #ffb6e0;
    text-shadow: 0 0 10px #ff77ff;
    opacity:0;
    animation: fadeIn 3s forwards;
}

/* Floating hearts styling */
.heart {
    position: absolute;
    color: #ff58d1;
    font-size: 25px;
    animation: floatUp linear infinite;
    opacity: 0.8;
    pointer-events:none;
}

/* Heart animation */
@keyframes floatUp {
    from { transform: translateY(100vh) scale(0.5); opacity:0; }
    to { transform: translateY(-20vh) scale(1.5); opacity:1; }
}

/* Typing effect for subtexts */
@keyframes typing { from { width:0; } to { width:100%; } }
.typing {
    display:inline-block;
    overflow:hidden;
    white-space:nowrap;
    border-right: 3px solid #ff77ff;
}

/* Fade-in animation for love paragraph */
@keyframes fadeIn { to { opacity:1; } }

</style>
</head>
<body>

<h1>My Love, My Life ❤️</h1>

<!-- Typing subtexts -->
<p class="typing-text" data-text="You are not just my wife… You are the universe where my soul feels at home."></p>
<p class="typing-text" data-text="Every moment with you is pure magic, meri jaan."></p>
<p class="typing-text" data-text="I love you more than words can ever express 💖"></p>

<!-- Love paragraph -->
<p id="lovePara">
Tum meri zindagi ka wo hissa ho jo sabse khoobsurat hai. 
Tumhari muskaan meri rooh ko sukoon deti hai, aur tumhari aankhein meri duniya ki roshni hain. 
Har pal tumhare saath bitana meri zindagi ka sabse pyaara pal hai. 💞
</p>

<script>
// Floating hearts
for (let i = 0; i < 30; i++) {
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (15 + Math.random() * 20) + "px";
    h.style.animationDuration = (4 + Math.random() * 5) + "s";
    h.style.animationDelay = (Math.random() * 5) + "s";
    document.body.appendChild(h);
}

// Typing effect for subtexts
const texts = document.querySelectorAll(".typing-text");
texts.forEach((p, index)=>{
    const text = p.getAttribute("data-text");
    setTimeout(()=> typeText(text, p), index * 2000); // stagger typing
});

function typeText(text, element){
    let i = 0;
    element.classList.add("typing");
    element.style.opacity = 1;
    function typing(){
        if(i < text.length){
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing,50);
        }
    }
    typing();
}
</script>

</body>
</html>
