<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Reels ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:#000;
  color:white;
}
header{
  padding:15px;
  text-align:center;
  background:#111;
  font-size:20px;
}
#reels{
  padding:10px;
}
.reel{
  margin-bottom:20px;
}
iframe{
  width:100%;
  height:500px;
  border-radius:15px;
  border:none;
}
.add-box{
  padding:15px;
  background:#111;
  position:sticky;
  bottom:0;
}
input{
  width:70%;
  padding:10px;
  border-radius:10px;
  border:none;
}
button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#ff4da6;
  color:white;
}
.loading{
  text-align:center;
  margin-top:30px;
}
</style>
</head>

<body>

<header>❤️ Our Private Reels</header>

<div id="reels">
  <div class="loading" id="loading">Loading reels...</div>
</div>

<div class="add-box">
  <input id="reelInput" placeholder="Paste Instagram Reel Link">
  <button onclick="addReel()">Add</button>
</div>

<script>
const SUPABASE_URL = "https://cilgmjkohnkwdrxbhpfl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpbGdtamtvaG5rd2RyeGJocGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYwNTc1OTAsImV4cCI6MjA4MTYzMzU5MH0.IXjZnRznlHx1OpyS7yWsKoeEpSyhKWGoUekjKR8PIco";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadReels(){
  const { data, error } = await supabase
    .from("reels")
    .select("*")
    .order("id",{ascending:false});

  if(error){
    document.getElementById("loading").innerText = "❌ Error loading reels";
    console.error(error);
    return;
  }

  document.getElementById("reels").innerHTML = "";

  data.forEach(r=>{
    const div = document.createElement("div");
    div.className = "reel";
    div.innerHTML = `
      <iframe src="${r.reel_link.replace("reel/","reel/embed/")}"></iframe>
    `;
    document.getElementById("reels").appendChild(div);
  });
}

async function addReel(){
  const link = document.getElementById("reelInput").value;
  if(!link) return alert("Reel link daalo");

  const { error } = await supabase
    .from("reels")
    .insert([{ reel_link: link }]);

  if(error){
    alert("Error adding reel");
    console.error(error);
  } else {
    document.getElementById("reelInput").value="";
    loadReels();
  }
}

loadReels();
</script>

</body>
</html>
