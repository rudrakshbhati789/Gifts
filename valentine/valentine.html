<!DOCTYPE html><html><head><title>Valentine Day</title><link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:black;overflow:hidden;font-family:cursive;color:hotpink}
.center{position:absolute;top:45%;left:50%;font-size:120px;transform:translate(-50%,-50%);animation:float 4s infinite;filter:drop-shadow(0 0 40px hotpink)}
.bg span{position:absolute;font-size:40px;animation:floatBg 6s infinite}
.frame{position:absolute;box-shadow:0 0 20px hotpink;padding:5px;border-radius:15px}
.frame img{width:80px;height:110px;border-radius:12px}
.text{position:absolute;top:65%;width:100%;text-align:center;font-size:20px;text-shadow:0 0 15px hotpink}
@keyframes float{50%{transform:translate(-50%,-55%)}}@keyframes floatBg{50%{transform:translateY(-60px)}}
</style></head><body>
<div class="bg"><span style="top:10%;left:10%">❤️</span><span style="bottom:20%;right:20%">💖</span></div>
<div class="frame" style="top:10%;left:10%"><img src="10.jpeg"></div>
<div class="frame" style="top:15%;right:10%"><img src="1.jpeg"></div>
<div class="frame" style="bottom:20%;left:15%"><img src="2.jpeg"></div>
<div class="frame" style="bottom:25%;right:15%"><img src="5.jpeg"></div>
<div class="center">❤️</div>
<div class="text" id="text"></div>
<button class="btn" onclick="location.href='app.html'">Pyar. ➜</button>
<script>const msg="I LOVE YOU ❤️ Tum meri zindagi ki sabse khoobsurat kahani ho 💖";let i=0;(function type(){if(i<msg.length){text.innerHTML+=msg[i++];setTimeout(type,80)}})();</script>
</body></html>
