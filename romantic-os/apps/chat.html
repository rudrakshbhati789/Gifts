<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat 💬</title>
<link rel="stylesheet" href="/romantic-os/css/style.css">
<script src="/romantic-os/js/os.js" defer></script>
</head>

<body class="app-bg">

  <!-- STATUS BAR -->
  <div class="status-bar glass">
    <span onclick="history.back()">◁</span>
    <span>Chat 💬</span>
    <span>💖</span>
  </div>

  <!-- CHAT CONTAINER -->
  <div class="chat-container glass">

    <div class="message received">
      <span class="text">Hi! How are you? 💕</span>
    </div>

    <div class="message sent">
      <span class="text">I’m great! ❤️ Missing you 😘</span>
    </div>

  </div>

  <!-- INPUT AREA -->
  <div class="chat-input glass">
    <input type="text" id="chatMsg" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send 💌</button>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="nav-bar glass">
    <span onclick="history.back()">◁</span>
    <span>⬤</span>
    <span>▢</span>
  </div>

<script>
function sendMessage(){
  let input = document.getElementById("chatMsg");
  if(input.value.trim() === "") return;
  let msg = document.createElement("div");
  msg.className = "message sent";
  let span = document.createElement("span");
  span.className = "text";
  span.innerText = input.value + " 💖";
  msg.appendChild(span);
  document.querySelector(".chat-container").appendChild(msg);
  input.value = "";
  document.querySelector(".chat-container").scrollTop = document.querySelector(".chat-container").scrollHeight;
}
</script>

</body>
</html>
