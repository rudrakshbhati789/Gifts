<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gallery 📸</title>
<link rel="stylesheet" href="/romantic-os/css/style.css">
<script src="../jss/os.js" defer></script>
</head>
<body class="app-bg romantic-bg">

<div class="status-bar glass">
  <span onclick="history.back()">←</span>
  <span>Gallery</span>
  <span>💖</span>
</div>

<div class="photo-grid">
  <img src="../assets/photos/p1.jpeg">
   <img src="../assets/photos/p2.jpeg">
    <img src="../assets/photos/p3.jpeg">
     <img src="../assets/photos/p4.jpeg">
      <img src="../assets/photos/p5.jpeg">
       <img src="../assets/photos/p6.jpeg">
        <img src="../assets/photos/p7.jpeg">
  <img src="../assets/photos/p8.jpeg">
  <img src="../assets/photos/p9.jpeg">
   <img src="../assets/photos/p10.jpeg">
    <img src="../assets/photos/p11.jpeg">
     <img src="../assets/photos/p12.jpeg">
      <img src="../assets/photos/p13.jpeg">
       <img src="../assets/photos/p14.jpeg">
</div>

<!-- Fullscreen Viewer -->
<div id="viewer" onclick="this.style.display='none'">
  <img id="big">
</div>

<script>
document.querySelectorAll(".photo-grid img").forEach(img=>{
 img.onclick=()=>{
   big.src=img.src;
   viewer.style.display="flex";
 }
});
</script>

</body>
</html>
