<head>

<style>

.box{

  width:100%;

  font-weight:600;
}

<body>

<div class="box">
  <h3>Paste Instagram Reel Link</h3>
  <input id="link" placeholder="https://www.instagram.com/reel/..." />
  <button onclick="addReel()">Save ❤️</button>
