<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love & Miss Page</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: pink;
    font-family: sans-serif;
  }
  button {
    padding: 20px 40px;
    margin: 20px;
    font-size: 24px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  button:active {
    transform: scale(1.1);
  }
  #loveBtn { background: #ff4d6d; color: white; }
  #missBtn { background: #ff85a2; color: white; }
  #callBtn { background: #ff0000; color: white; }
</style>
</head>
<body>

<h1>For My Love 💖</h1>
<button id="loveBtn">I Love You 💖</button>
<button id="missBtn">I Miss You 💌</button>
<button id="callBtn">Call Me ☎️</button>

<script>
function vibratePhone() {
  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]); // Vibrate pattern
  }
}

function sendWhatsAppMessage(message) {
  const phone = "YOUR_PHONE_NUMBER"; // Replace with your number in international format
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}

function callPhone() {
  const phone = "YOUR_PHONE_NUMBER"; // Replace with your number
  window.location.href = `tel:${phone}`;
}

// Button actions
document.getElementById("loveBtn").addEventListener("click", () => {
  vibratePhone();
  sendWhatsAppMessage("I Love You 💖");
});

document.getElementById("missBtn").addEventListener("click", () => {
  vibratePhone();
  sendWhatsAppMessage("I Miss You 💌");
});

document.getElementById("callBtn").addEventListener("click", () => {
  vibratePhone();
  callPhone();
});
</script>

</body>
</html>
