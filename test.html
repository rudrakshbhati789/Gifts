<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You – Special Gift</title>

    <style>
        body{
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(45deg, #ff6aa5, #ff9a9e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
            padding: 20px;
        }

        /* I LOVE YOU GLOW HEADING */
        h1{
            margin: 0;
            font-size: 11vw;
            color: #ff1e8a;
            text-shadow: 0 0 10px #ff1e8a, 0 0 30px #ff1e8a, 0 0 60px #ff1e8a;
            animation: glow 2s infinite alternate;
            z-index: 10;
        }

        @keyframes glow{
            from{ text-shadow: 0 0 10px #ff1e8a, 0 0 20px #ff1e8a; }
            to{ text-shadow: 0 0 30px #ff1e8a, 0 0 80px #ff1e8a; }
        }

        /* NAME GLOW */
        .name{
            margin-top: 10px;
            font-size: 7vw;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff6dd6;
            animation: nameGlow 2s infinite alternate;
        }

        @keyframes nameGlow{
            from{ text-shadow: 0 0 10px #fff; }
            to{ text-shadow: 0 0 30px #ffb3f3; }
        }

        /* TYPING MESSAGE */
        .type-msg{
            margin-top: 20px;
            font-size: 5vw;
            color: white;
            border-right: 3px solid white;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 4s steps(30) forwards, blink 0.5s infinite alternate;
        }

        @keyframes typing{
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink{
            from { border-color: transparent; }
            to { border-color: white; }
        }

        /* BUTTON */
        .btn{
            margin-top: 35px;
            padding: 14px 35px;
            font-size: 5vw;
            border-radius: 40px;
            border: none;
            background: linear-gradient(to right, #ff7eb3, #ff458a);
            color: white;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 0 15px #ff2c91;
            transition: 0.3s;
            z-index: 10;
        }

        .btn:hover{
            transform: scale(1.1);
            box-shadow: 0 0 25px #ff0079;
        }

        /* HEART BURST */
        .burst-heart{
            position: absolute;
            font-size: 24px;
            color: #ff0059;
            pointer-events: none;
            animation: burst 1s forwards ease-out;
        }

        @keyframes burst{
            0%{ transform: scale(0.5) translate(0,0); opacity: 1; }
            100%{
                transform: scale(2) translate(var(--x), var(--y));
                opacity: 0;
            }
        }

        /* ROSE FALL 🌹 */
        .rose{
            position: fixed;
            top: -50px;
            font-size: 28px;
            animation: fall linear forwards;
            opacity: 0.9;
        }

        @keyframes fall{
            from{ transform: translateY(-50px) rotate(0deg); }
            to{ transform: translateY(110vh) rotate(360deg); }
        }

        /* SPARKLE PARTICLES ✨ */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkleMove 2s linear infinite;
            opacity: 0.8;
        }

        @keyframes sparkleMove {
            from { transform: translateY(0); opacity: 1; }
            to   { transform: translateY(-40px); opacity: 0; }
        }
    </style>
</head>

<body>

    <h1>I Love You ❤️</h1>

    <div class="name">Ishika My Love 💖</div>

    <div class="type-msg">You are my world… my everything ❤️</div>

    <button class="btn" onclick="makeMagic()">Click Here</button>

    <script>
        /* ROSE FALL CREATOR 🌹 */
        setInterval(() => {
            const rose = document.createElement("div");
            rose.classList.add("rose");
            rose.innerHTML = "🌹";
            rose.style.left = Math.random() * 100 + "vw";
            rose.style.animationDuration = (3 + Math.random() * 3) + "s";

            document.body.appendChild(rose);
            setTimeout(() => rose.remove(), 6000);
        }, 400);

        /* SPARKLES ✨ */
        setInterval(() => {
            const sp = document.createElement("div");
            sp.classList.add("sparkle");
            sp.style.left = Math.random() * 100 + "vw";
            sp.style.top = Math.random() * 100 + "vh";

            document.body.appendChild(sp);
            setTimeout(() => sp.remove(), 2000);
        }, 150);

        /* HEART BURST + REDIRECT */
        function makeMagic(){
            for(let i=0;i<50;i++){
                const heart = document.createElement("div");
                heart.classList.add("burst-heart");
                heart.innerHTML = "❤️";

                let x = (Math.random() - 0.5) * 350;
                let y = (Math.random() - 0.5) * 350;

                heart.style.setProperty("--x", `${x}px`);
                heart.style.setProperty("--y", `${y}px`);
                heart.style.left = "50%";
                heart.style.top = "50%";

                document.body.appendChild(heart);

                setTimeout(()=> heart.remove(), 1000);
            }

            setTimeout(()=>{
                window.location.href = "next.html";
            },1000);
        }
    </script>

</body>
</html>
