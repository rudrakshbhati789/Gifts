<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music 🎶</title>
<link rel="stylesheet" href="/romantic-os/css/style.css">
<script src="/romantic-os/js/os.js" defer></script>
</head>

<body class="app-bg">

  <!-- STATUS BAR -->
  <div class="status-bar glass">
    <span onclick="history.back()">◁</span>
    <span>Music 🎶</span>
    <span>🔊</span>
  </div>

  <!-- PAGE TITLE -->
  <div class="center" style="margin-top:30px;">
    <h2>🎶 Love Music</h2>
  </div>

  <!-- AUDIO PLAYER -->
  <div class="center" style="margin-top:20px;">
    <audio controls autoplay loop style="width:90%;">
      <source src="../assets/music/love.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="nav-bar glass">
    <span onclick="history.back()">◁</span>
    <span>⬤</span>
    <span>▢</span>
  </div>

</body>
</html>
