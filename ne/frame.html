<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us 💞</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1b1f3b,#05060f 70%);
  font-family:Poppins,sans-serif;
  overflow:hidden;
}

/* GLOW FRAME */
.frame-wrap{
  position:relative;
  padding:14px;
  border-radius:28px;
  background:linear-gradient(135deg,#ff9ad5,#ff4da6,#ff1975);
  box-shadow:
    0 0 30px rgba(255,77,166,.9),
    0 0 70px rgba(255,26,140,.7);
  animation:pulse 3.5s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.03)}
}

/* IMAGE */
.frame-wrap img{
  width:90vw;
  max-width:420px;
  border-radius:20px;
  display:block;
}

/* TEXT */
.caption{
  text-align:center;
  margin-top:14px;
  color:white;
  font-size:clamp(14px,4vw,18px);
  text-shadow:0 0 18px rgba(255,255,255,.6);
}

/* FLOATING HEARTS */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:16px;
  opacity:.6;
  animation:rise 7s linear forwards;
}

@keyframes rise{
  to{transform:translateY(-120vh);opacity:0}
}

/* BACK BUTTON */
.back{
  position:fixed;
  top:16px;
  left:16px;
  padding:8px 14px;
  border-radius:20px;
  background:rgba(255,255,255,.15);
  color:white;
  text-decoration:none;
  font-size:13px;
  backdrop-filter:blur(6px);
}
</style>
</head>

<body>

<a href="/ne/bg.html" class="back">← Back</a>

<div class="frame-wrap">
  <!-- 🔴 IMAGE PATH CHANGE HERE -->
  <img src="/videoo/framw.png" alt="Our Frame">
  <div class="caption">
    Always You. Always Me. 💞<br>
    <small>Forever Together 🌙</small>
  </div>
</div>

<script>
/* HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💗";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},900);
</script>

</body>
</html>
