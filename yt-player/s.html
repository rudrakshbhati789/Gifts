<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Page</title>

<style>
    body{
        background: linear-gradient(to right, #ffdde1, #ffc0cb);
        overflow:hidden;
        height:100vh;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        position:relative;
        text-align:center;
        font-family:"Poppins",sans-serif;
    }

    /* TYPEWRITER TEXT */
    h1{
        position:absolute;
        top:30%;
        left:50%;
        transform:translateX(-50%);
        color:#d30069;
        font-weight:600;
        font-size:clamp(22px, 6vw, 36px);
        white-space:nowrap;
        overflow:hidden;
        border-right:3px solid #d30069;
        width:fit-content;
        max-width:90vw;
        padding-right:6px;
        animation:typing 3.5s steps(40) 1s forwards, float 4s ease-in-out infinite;
        z-index:3;
    }

    @keyframes typing{
        from{ width:0; }
        to{ width:100%; }
    }

    @keyframes float{
        0%{ transform:translate(-50%,0); }
        50%{ transform:translate(-50%,-25px); }
        100%{ transform:translate(-50%,0); }
    }

    /* FOG EFFECT */
    .fog{
        position:absolute;
        width:320px;
        height:320px;
        background:radial-gradient(circle, rgba(255,170,200,0.55), rgba(255,170,200,0));
        filter:blur(65px);
        animation:fogMove 12s infinite ease-in-out;
        border-radius:50%;
        z-index:1;
    }
    .fog:nth-child(1){ top:10%; left:10%; animation-duration:14s; }
    .fog:nth-child(2){ top:60%; left:20%; animation-duration:16s; }
    .fog:nth-child(3){ top:30%; left:70%; animation-duration:18s; }
    .fog:nth-child(4){ top:70%; left:60%; animation-duration:20s; }

    @keyframes fogMove{
        0%{ transform:translate(0,0) scale(1); }
        50%{ transform:translate(50px,-50px) scale(1.3); }
        100%{ transform:translate(0,0) scale(1); }
    }

    /* FALLING HEARTS */
    .heart{
        position:absolute;
        color:#ff0066;
        font-size:25px;
        animation:fall 5s linear infinite;
        opacity:0.8;
        z-index:2;
        pointer-events:none;
    }
    @keyframes fall{
        0%{ transform:translateY(-100px) rotate(0deg); opacity:1; }
        100%{ transform:translateY(110vh) rotate(360deg); opacity:0; }
    }

    /* CLICK TO REVEAL MESSAGE */
    .reveal-btn{
        margin-top:250px;
        padding:14px 32px;
        background:#ff4d88;
        color:white;
        font-size:clamp(18px, 5vw, 22px);
        border-radius:30px;
        text-decoration:none;
        cursor:pointer;
        font-weight:600;
        box-shadow:0 0 18px rgba(255,50,130,0.8);
        transition:0.3s;
        z-index:3;
    }
    .reveal-btn:hover{
        background:#ff1a66;
        transform:scale(1.07);
    }

    .hidden-msg{
        opacity:0;
        font-size:clamp(20px,5vw,30px);
        color:#b60055;
        margin-top:20px;
        font-weight:600;
        transition:0.6s;
        z-index:4;
    }

</style>
</head>

<body>

<!-- Fog -->
<div class="fog"></div>
<div class="fog"></div>
<div class="fog"></div>
<div class="fog"></div>

<!-- Typewriter Text -->
<h1>I Love You Mere Pyare Biwi 🥰🫀</h1>

<!-- Reveal Button -->
<div class="reveal-btn" onclick="revealMessage()">Click karo mere jaan ❤️</div>

<!-- Hidden Message -->
<div id="msg" class="hidden-msg">Meri Jaan, Ready Ho? ❤️</div>

<script>
/* Falling Hearts Script */
function createHeart(){
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (20 + Math.random()*20) + "px";
    heart.style.animationDuration = (3 + Math.random()*3) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,300);

/* Reveal + Redirect */
function revealMessage(){
    let x = document.getElementById("msg");
    x.style.opacity = 1;

    // Redirect after reveal
    setTimeout(()=>{
        window.location.href = "/yt-player/index.html";
    }, 1500);
}
</script>

</body>
</html>
