<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Page</title>
    <style>
        body{
            background: linear-gradient(to right, #ffdde1, #ffc0cb);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            text-align: center;
        }

        h1{
            font-size: 2.0rem;
            font-family: "Poppins", sans-serif;
            color: #b60055;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: float 5s ease-in-out infinite;
            position: relative;
            z-index: 3;
        }

        /* Floating Text */
        @keyframes float {
            0%{ transform: translate(0px, 0px); }
            25%{ transform: translate(20px, -20px); }
            50%{ transform: translate(0px, -40px); }
            75%{ transform: translate(-20px, -20px); }
            100%{ transform: translate(0px, 0px); }
        }

        /* Fog */
        .fog {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,170,200,0.6), rgba(255,170,200,0));
            filter: blur(60px);
            animation: fogMove 12s infinite ease-in-out;
            border-radius: 50%;
            z-index: 1;
        }

        .fog:nth-child(1){ top: 10%; left: 10%; animation-duration: 14s; }
        .fog:nth-child(2){ top: 60%; left: 20%; animation-duration: 16s; }
        .fog:nth-child(3){ top: 30%; left: 70%; animation-duration: 18s; }
        .fog:nth-child(4){ top: 70%; left: 60%; animation-duration: 20s; }

        @keyframes fogMove {
            0%{ transform: translate(0,0) scale(1); }
            50%{ transform: translate(50px, -50px) scale(1.3); }
            100%{ transform: translate(0,0) scale(1); }
        }

        /* Falling hearts */
        .heart {
            position: absolute;
            color: #ff0066;
            font-size: 25px;
            animation: fall 5s linear infinite;
            opacity: 0.8;
            z-index: 2;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* ❤️ Button Styling */
        .btn{
            margin-top: 25px;
            padding: 12px 25px;
            background: #ff4d88;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            border-radius: 25px;
            box-shadow: 0 0 15px rgba(255, 80, 150, 0.8);
            transition: 0.3s;
            z-index: 3;
        }

        .btn:hover{
            background: #ff1a66;
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(255, 0, 100, 1);
        }

    </style>
</head>
<body>

    <!-- Fog -->
    <div class="fog"></div>
    <div class="fog"></div>
    <div class="fog"></div>
    <div class="fog"></div>

    <!-- Text -->
    <h1>I Love You Mere Pyare Biwi 🥰🫀</h1>

    <!-- Center Button -->
    <a href="/yt-player/index.html" class="btn">Idhar click kro mere jaan 😘</a>

    <!-- Hearts Script -->
    <script>
        function createHeart(){
            let heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.fontSize = (20 + Math.random() * 20) + "px";
            heart.style.animationDuration = (3 + Math.random() * 3) + "s";
            document.body.appendChild(heart);

            setTimeout(()=>{ heart.remove(); }, 6000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
