<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meri Jaan – Login ❤️</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(135deg, #1a0028, #330033, #4b004b);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #ffd6ec;
  font-family: 'Playfair Display', serif;
}

/* Elegant Floating Hearts */
.heart {
  position: absolute;
  font-size: 2.2rem;
  animation: float 7s linear infinite;
  opacity: 0.35;
}
@keyframes float {
  0% { transform: translateY(120vh) scale(0.7); opacity: 0.3; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0.9; }
}

/* Romantic login box */
.login-box {
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 35px;
  border-radius: 25px;
  width: 90%;
  max-width: 360px;
  box-shadow: 0 0 25px rgba(255, 0, 140, 0.5);
  text-align: center;
  animation: popIn 1.3s ease-out forwards;
  opacity: 0;
}
@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-top: 18px;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  font-size: 1rem;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 22px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff1f7a, #ff60c3);
  color: white;
  font-size: 1.1rem;
  font-weight: bold;
  box-shadow: 0 0 12px rgba(255, 30, 150, 0.6);
}
</style>
</head>

<body>

<!-- Floating romantic hearts -->
<div class="heart" style="left: 10%; animation-duration: 8s;">💗</div>
<div class="heart" style="left: 25%; animation-duration: 6s;">💖</div>
<div class="heart" style="left: 50%; animation-duration: 7s;">❤️</div>
<div class="heart" style="left: 75%; animation-duration: 9s;">💕</div>
<div class="heart" style="left: 90%; animation-duration: 6.5s;">💞</div>
<audio id="bg-music" autoplay loop>
  <source src="/Audio/bg1.mp3" type="audio/mpeg">
</audio>

<!-- Login box -->
<div class="login-box">
  <h2 class="text-3xl mb-2">Welcome Meri Jaan ❤️</h2>
  <p class="opacity-80 text-sm">Apke liye ek chhota sa surprise...  
  <br> Pehle secret password dalo 💕</p>

  <input type="password" id="password" placeholder="Secret Password...">
  <button onclick="login()">Unlock My Love 🔐</button>

  <p id="error" class="text-red-300 mt-3 hidden">Galat password hai Jaan 😢</p>
</div>

<script>
function login() {
  const pass = document.getElementById("password").value;

  if (pass === "BABU KE MUMMY") {
    window.location.href = "loading.html";
  } else {
    document.getElementById("error").classList.remove("hidden");
  }
}
</script>

</body>
</html>
