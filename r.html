<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Image Heart with Border</title>
<style>
body {
  margin:0;
  height:100vh;
  overflow:hidden;
  background:#000;
  font-family:"Poppins",sans-serif;
  position:relative;
}

h1 {
  position:absolute;
  top:5vh;
  width:100%;
  text-align:center;
  color:white;
  font-size:6vw;
  text-shadow:0 0 30px #fff;
}
.couple {
  position:absolute;
  top:15vh;
  width:100%;
  text-align:center;
  font-size:4vw;
  font-weight:700;
  color:white;
  text-shadow:0 0 15px #ff69b4;
}

.heart {
  position:absolute;
  width:150px;
  height:150px;
  animation: pulse 1s infinite;
  filter: drop-shadow(0 0 15px rgba(255,0,0,0.7));
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

#trailCanvas {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* Heart SVG border & image styles */
.heart svg {
  width: 100%;
  height: 100%;
}

.heart path {
  fill: none; /* transparent inside */
  stroke-width: 3;
  stroke: #fff; /* border color */
}

.heart image {
  clip-path: url(#clipHeart1); /* or clipHeart2 */
}
</style>
</head>
<body>

<h1>Our Hearts ❤️</h1>
<div class="couple">Rudra ❤️ Ishika</div>

<!-- Heart 1 with image and border -->
<div class="heart" id="heart1">
<svg viewBox="0 0 32 29.6">
  <defs>
    <clipPath id="clipHeart1">
      <path d="M23.6,0c-2.7,0-5.2,1.2-6.6,3.2C15.6,1.2,13.1,0,10.4,0C4.7,0,0,4.7,0,10.4
      c0,6.9,10.2,12.9,16,19.2c5.8-6.3,16-12.3,16-19.2C32,4.7,27.3,0,23.6,0z"/>
    </clipPath>
  </defs>
  <path d="M23.6,0c-2.7,0-5.2,1.2-6.6,3.2C15.6,1.2,13.1,0,10.4,0C4.7,0,0,4.7,0,10.4
      c0,6.9,10.2,12.9,16,19.2c5.8-6.3,16-12.3,16-19.2C32,4.7,27.3,0,23.6,0z"/>
  <image x="0" y="0" width="32" height="29.6" href="https://via.placeholder.com/300x300/ff4f4f/ffffff?text=Ishika" clip-path="url(#clipHeart1)"/>
</svg>
</div>

<!-- Heart 2 with image and border -->
<div class="heart" id="heart2">
<svg viewBox="0 0 32 29.6">
  <defs>
    <clipPath id="clipHeart2">
      <path d="M23.6,0c-2.7,0-5.2,1.2-6.6,3.2C15.6,1.2,13.1,0,10.4,0C4.7,0,0,4.7,0,10.4
      c0,6.9,10.2,12.9,16,19.2c5.8-6.3,16-12.3,16-19.2C32,4.7,27.3,0,23.6,0z"/>
    </clipPath>
  </defs>
  <path d="M23.6,0c-2.7,0-5.2,1.2-6.6,3.2C15.6,1.2,13.1,0,10.4,0C4.7,0,0,4.7,0,10.4
      c0,6.9,10.2,12.9,16,19.2c5.8-6.3,16-12.3,16-19.2C32,4.7,27.3,0,23.6,0z"/>
  <image x="0" y="0" width="32" height="29.6" href="https://via.placeholder.com/300x300/33ffff/ffffff?text=Rudra" clip-path="url(#clipHeart2)"/>
</svg>
</div>

<canvas id="trailCanvas"></canvas>

<script>
// Original animation & canvas code remains unchanged
const heart1 = document.getElementById('heart1');
const heart2 = document.getElementById('heart2');
const canvas = document.getElementById('trailCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const size = Math.min(window.innerWidth, window.innerHeight) * 0.15;
  [heart1, heart2].forEach(h => {
    h.style.width = size + 'px';
    h.style.height = size + 'px';
  });
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let pos1 = {x: window.innerWidth*0.25, y: window.innerHeight*0.5};
let pos2 = {x: window.innerWidth*0.65, y: window.innerHeight*0.5};
let speed1 = {x:0.5 + Math.random()*0.5, y:0.5 + Math.random()*0.5};
let speed2 = {x:-0.5 - Math.random()*0.5, y:-0.5 - Math.random()*0.5};

let trail1=[], trail2=[], particles=[], waveOffset=0;

function animateHearts(){
  pos1.x += speed1.x; pos1.y += speed1.y;
  pos2.x += speed2.x; pos2.y += speed2.y;

  if(pos1.x<0||pos1.x>canvas.width-heart1.clientWidth) speed1.x*=-1;
  if(pos1.y<0||pos1.y>canvas.height-heart1.clientHeight) speed1.y*=-1;
  if(pos2.x<0||pos2.x>canvas.width-heart2.clientWidth) speed2.x*=-1;
  if(pos2.y<0||pos2.y>canvas.height-heart2.clientHeight) speed2.y*=-1;

  heart1.style.left = pos1.x+'px';
  heart1.style.top = pos1.y+'px';
  heart2.style.left = pos2.x+'px';
  heart2.style.top = pos2.y+'px';

  const dx = pos2.x-pos1.x;
  const dy = pos2.y-pos1.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  const scale = 1 + 0.2*(1 - Math.min(dist/500,1));
  heart1.style.transform = `scale(${scale})`;
  heart2.style.transform = `scale(${scale})`;

  trail1.push({x: pos1.x+heart1.clientWidth/2, y: pos1.y+heart1.clientHeight/2});
  trail2.push({x: pos2.x+heart2.clientWidth/2, y: pos2.y+heart2.clientHeight/2});
  if(trail1.length>50) trail1.shift();
  if(trail2.length>50) trail2.shift();

  const particleSize = Math.max(2, Math.min(canvas.width, canvas.height)*0.004);
  particles.push({x: pos1.x+heart1.clientWidth/2, y: pos1.y+heart1.clientHeight/2, color:'red', alpha:1, size:particleSize});
  particles.push({x: pos2.x+heart2.clientWidth/2, y: pos2.y+heart2.clientHeight/2, color:'cyan', alpha:1, size:particleSize});

  drawCanvas(dist);
  requestAnimationFrame(animateHearts);
}

function drawCanvas(dist){
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  trail1.forEach((t,i)=>{
    ctx.beginPath();
    ctx.arc(t.x,t.y,i/3,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,0,0,${i/50})`;
    ctx.shadowColor = "rgba(255,0,0,0.8)";
    ctx.shadowBlur = 20;
    ctx.fill();
  });
  trail2.forEach((t,i)=>{
    ctx.beginPath();
    ctx.arc(t.x,t.y,i/3,0,Math.PI*2);
    ctx.fillStyle = `rgba(0,255,255,${i/50})`;
    ctx.shadowColor = "rgba(0,255,255,0.8)";
    ctx.shadowBlur = 20;
    ctx.fill();
  });

  particles.forEach((p)=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle = `rgba(${p.color==='red'?255:0},${p.color==='red'?0:255},${p.color==='red'?0:255},${p.alpha})`;
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 15;
    ctx.fill();
    p.alpha -=0.03;
    p.y -=0.5;
    p.x += (Math.random()-0.5)*1;
  });
  particles = particles.filter(p=>p.alpha>0);

  const maxDist=400;
  const effect=Math.max(0,1-dist/maxDist);
  const steps=50;
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    let t=i/steps;
    let x = pos1.x+heart1.clientWidth/2 + (pos2.x-pos1.x)*t;
    let yMid = pos1.y+heart1.clientHeight/2 + (pos2.y-pos1.y)*t;
    let y = yMid + Math.sin((t*5 + waveOffset)*Math.PI*2)*20*(1-t);
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = `rgba(255,0,0,${0.8*effect})`;
  ctx.lineWidth = 3*effect;
  ctx.shadowColor = `rgba(255,0,0,${0.8*effect})`;
  ctx.shadowBlur = 25*effect;
  ctx.stroke();

  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    let t=i/steps;
    let x = pos2.x+heart2.clientWidth/2 + (pos1.x-pos2.x)*t;
    let yMid = pos2.y+heart2.clientHeight/2 + (pos1.y-pos2.y)*t;
    let y = yMid + Math.sin((t*5 + waveOffset)*Math.PI*2)*20*(1-t);
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle = `rgba(0,255,255,${0.8*effect})`;
  ctx.lineWidth = 3*effect;
  ctx.shadowColor = `rgba(0,255,255,${0.8*effect})`;
  ctx.shadowBlur = 25*effect;
  ctx.stroke();

  waveOffset += 0.05;
}

animateHearts();
</script>
</body>
</html>
