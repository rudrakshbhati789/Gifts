<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Ishika ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">
<style>
body{
  background:#000;
  color:white;
  font-family:Poppins,sans-serif;
  text-align:center;
  overflow:hidden;
  padding:0 10px;
}

/* Heading */
h1{
  font-family:'Great Vibes',cursive;
  font-size:clamp(2rem,8vw,3rem);
  margin:20px 0;
}

/* Text container */
#text{
  padding:clamp(10px,4vw,20px);
  font-size:clamp(0.9rem,4vw,1.1rem);
  line-height:1.6;
  max-width:800px;
  margin:auto;
  text-align:left;
}

/* Floating hearts */
.heart{
  position:fixed;
  color:red;
  font-size:clamp(16px,4vw,26px);
  animation:float 4s linear infinite;
}

@keyframes float{
  0%{bottom:0;opacity:1;transform:translateX(0)}
  100%{bottom:100vh;opacity:0;transform:translateX(30px)}
}

/* Button */
button{
  margin:20px auto;
  padding:clamp(10px,2vw,14px) clamp(20px,5vw,30px);
  border:none;
  border-radius:30px;
  background:#ff4f81;
  color:white;
  font-size:clamp(0.9rem,3vw,1.1rem);
  font-weight:600;
  cursor:pointer;
  display:block;
}

/* Center text on small screens */
@media(max-width:480px){
  #text{
    text-align:center;
  }
}
</style>
</head>

<body>

<h1>Biwii ❤️</h1>
<div id="text"></div>
<button onclick="next()">Next Surprise 💍</button>

<script>
const msg=`Meri pyaari auart ❤️
Meri pyaari Jaan ❤️

Is saal ki sabse khoobsurat baat tum ho.

Is saal tum pehle meri
sabse achi dost bani,
phir meri girlfriend bani,
phir meri wife bani,
phir meri biwi bani,
aur ab… tum meri poori duniya ho.

Ek saal me itna kuch badal gaya,
par jo cheez nahi badli,
wo hai mera pyaar tumhare liye.

Har baat share karna,
har problem me ek dusre ka haath pakadna,
aur bina bole sab samajh lena —
ye sab sirf tumhare saath hi mumkin tha.

Is saal ke har best moment me
tum thi,
tum ho,
aur hamesha tum hi rahogi.

Naye saal me main koi nayi cheez nahi maangta,
bas tumhara saath,
tumhari muskaan,
aur tumhara haath —
zindagi bhar ke liye.

Happy New Year meri biwi 💖  
Main tumse beintehaa pyaar karta hoon ❤️
`;

let i=0;
setInterval(()=>{
 if(i<msg.length){
  document.getElementById("text").innerHTML+=msg.charAt(i);
  i++;
 }
},50);

setInterval(()=>{
 const h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"vw";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),4000);
},300);

function next(){
 window.location="/new year/memories.html";
}
</script>

</body>
</html>
