<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Gift ❤️</title>
<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: linear-gradient(to top, #ff5fa2, #ff9ecb);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

.gift-wrapper {
  position: relative;
  width: 220px;
  height: 220px;
  perspective: 600px;
  cursor: pointer;
}

.gift-box {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
}

.lid {
  width: 100%;
  height: 50%;
  background: #ff2e63;
  position: absolute;
  top: 0;
  left: 0;
  border-radius: 10px 10px 0 0;
  transform-origin: top;
  z-index: 2;
}

.base {
  width: 100%;
  height: 100%;
  background: #ff9ecb;
  position: absolute;
  bottom: 0;
  left: 0;
  border-radius: 0 0 10px 10px;
  z-index: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  box-sizing: border-box;
  flex-direction: column;
}

.gift-text {
  text-align: center;
  font-size: 16px;
  color: #fff;
  line-height: 1.3;
  opacity: 0;
}

.heart {
  position: absolute;
  font-size: 24px;
  color: #ffeb3b;
  animation: floatHeart 3s linear infinite;
}

@keyframes floatHeart {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  50% { transform: translateY(-150px) scale(1.3); opacity: 0.7; }
  100% { transform: translateY(-300px) scale(1.6); opacity: 0; }
}

.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 10px #fff, 0 0 20px #ff2e63;
  animation: sparkleAnim 2s linear infinite;
}

@keyframes sparkleAnim {
  0% { transform: scale(0); opacity: 0; }
  50% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0); opacity: 0; }
}

.floating-message {
  position: absolute;
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 0 0 15px #ff2e63;
  animation: floatMsg 5s linear forwards;
  pointer-events: none;
}

@keyframes floatMsg {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-400px) scale(1.5); }
}

</style>
</head>
<body>

<div class="gift-wrapper" id="giftWrapper">
  <div class="gift-box" id="giftBox">
    <div class="lid" id="lid"></div>
    <div class="base">
      <div class="gift-text" id="giftText"></div>
    </div>
  </div>
</div>

<script>
const giftWrapper = document.getElementById('giftWrapper');
const lid = document.getElementById('lid');
const giftText = document.getElementById('giftText');

// Two-line message
const messages = [
  "Madam ji, race jit li! ❤️ Dil bhi jit liya 😘 Rudraksh hamesha tumhare saath hai ❤️",
  "Me hamesha tumhare saath hu mere payre Biwi ❤️"
];

// Type messages one by one
function typeMessages(lines, element, speed = 50) {
  element.innerHTML = "";
  element.style.opacity = 1;
  let lineIndex = 0;

  function typeLine() {
    let i = 0;
    const interval = setInterval(() => {
      element.innerHTML = element.innerHTML.replace(/\|$/, '');
      element.innerHTML += lines[lineIndex][i] + "|";
      i++;
      if(i >= lines[lineIndex].length) {
        clearInterval(interval);
        element.innerHTML = element.innerHTML.replace(/\|$/, '');
        lineIndex++;
        if(lineIndex < lines.length) setTimeout(typeLine, 500);
      }
    }, speed);
  }

  typeLine();
}

// Floating hearts
function createHearts() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.style.left = Math.random() * window.innerWidth + 'px';
  heart.style.top = window.innerHeight + 'px';
  heart.style.fontSize = (20 + Math.random() * 20) + 'px';
  heart.innerText = "❤️";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 3000);
}

// Sparkles
function createSparkles() {
  const sparkle = document.createElement('div');
  sparkle.className = 'sparkle';
  sparkle.style.left = Math.random() * window.innerWidth + 'px';
  sparkle.style.top = Math.random() * window.innerHeight + 'px';
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 2000);
}

// Floating I love you messages
const loveMessages = [
  "I Love You ❤️", 
  "Mujhe Tumse Pyaar Hai 😘", 
  "Forever Yours 💖", 
  "Dil Se ❤️", 
  "Tum Meri Ho 💕",
  "Biwi ❤️ Tum Ho Meri Dunia",
  "Madam ji 💖 Hamesha Saath"
];

function createLoveMsg() {
  const msg = document.createElement('div');
  msg.className = 'floating-message';
  msg.style.left = Math.random() * window.innerWidth + 'px';
  msg.style.top = window.innerHeight + 'px';
  msg.innerText = loveMessages[Math.floor(Math.random() * loveMessages.length)];
  document.body.appendChild(msg);
  setTimeout(() => msg.remove(), 5000);
}

// Sparkle burst when lid opens
function sparkleBurst() {
  for(let i = 0; i < 30; i++){
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = (giftWrapper.offsetLeft + giftWrapper.offsetWidth/2) + 'px';
    sparkle.style.top = (giftWrapper.offsetTop + giftWrapper.offsetHeight/2) + 'px';
    sparkle.style.width = sparkle.style.height = (4 + Math.random()*6) + 'px';
    document.body.appendChild(sparkle);
    const angle = Math.random()*2*Math.PI;
    const dist = 50 + Math.random()*100;
    const x = Math.cos(angle)*dist;
    const y = Math.sin(angle)*dist;
    sparkle.style.transition = "transform 1s ease-out, opacity 1s ease-out";
    setTimeout(()=> sparkle.style.transform = `translate(${x}px, ${y}px)`, 50);
    setTimeout(()=> sparkle.remove(), 1200);
  }
}

// Animate hearts, sparkles, love messages
setInterval(createHearts, 300);
setInterval(createSparkles, 500);
setInterval(createLoveMsg, 1000);

// Click to open lid with bounce and show message + sparkle burst
giftWrapper.addEventListener('click', () => {
  lid.style.transition = "transform 0.6s cubic-bezier(.68,-0.55,.27,1.55)";
  lid.style.transform = 'rotateX(-120deg)';
  setTimeout(()=> {
    sparkleBurst();
    typeMessages(messages, giftText, 50);
  }, 600);
});
</script>

</body>
</html>
