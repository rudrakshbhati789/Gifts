<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonlit Memories 🌙💖</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:Poppins,sans-serif;
    background:radial-gradient(circle at top,#1b1f3b,#05060f 70%);
}

/* title */
.title{
    position:fixed;
    top:18px;
    width:100%;
    text-align:center;
    color:white;
    font-size:clamp(18px,4vw,28px);
    text-shadow:0 0 20px rgba(255,255,255,.6);
    z-index:10;
}

/* floating cards */
.memory{
    position:absolute;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 14px rgba(255,255,255,.35);
    cursor:pointer;
}

.memory img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* caption */
.caption{
    position:absolute;
    bottom:0;
    width:100%;
    padding:4px;
    font-size:11px;
    text-align:center;
    color:white;
    background:linear-gradient(to top,rgba(0,0,0,.8),transparent);
}

/* ===== VIEWER ===== */
.viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:99;
}

.circle-wrap{
    width:280px;
    height:280px;
    border-radius:50%;
    padding:8px;
    background:radial-gradient(circle,#ffd1e8 0%,#ff7abf 40%,#ff1a8c 70%,#ff007f 100%);
    box-shadow:
        0 0 30px #ff4da6,
        0 0 60px rgba(255,77,166,0.9),
        0 0 90px rgba(255,26,140,0.8);
}

.circle-wrap img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

/* 🎁 BUTTON */
.next-btn{
    position:fixed;
    bottom:22px;
    right:20px;
    padding:14px 26px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#ff6fb1,#ff1a8c);
    color:white;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 0 25px #ff4da6;
    z-index:20;
    animation:floatBtn 2.5s ease-in-out infinite alternate;
}

.next-btn:hover{
    transform:scale(1.05);
}

@keyframes floatBtn{
    from{transform:translateY(0)}
    to{transform:translateY(-8px)}
}

/* shooting star */
.shooting-star{
    position:absolute;
    width:150px;
    height:2px;
    background:linear-gradient(90deg,white,rgba(255,255,255,0));
    filter:drop-shadow(0 0 8px white);
    animation: shoot 1.1s linear forwards;
}
@keyframes shoot{
    to{
        transform:translate(420px,220px) rotate(-35deg);
        opacity:0;
    }
}

/* wish bubble */
.wish{
    position:absolute;
    color:white;
    font-size:clamp(12px,3vw,16px);
    padding:8px 14px;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(6px);
    box-shadow:0 0 20px rgba(255,255,255,0.4);
    animation:wishFloat 3.5s ease forwards;
    pointer-events:none;
}
@keyframes wishFloat{
    0%{opacity:0; transform:translateY(20px) scale(0.9)}
    20%{opacity:1}
    100%{opacity:0; transform:translateY(-80px) scale(1.05)}
}

/* hearts */
.heart{
    position:absolute;
    bottom:-20px;
    font-size:14px;
    opacity:.5;
    animation: rise 7s linear forwards;
}
@keyframes rise{
    to{transform:translateY(-110vh);opacity:0}
}
</style>
</head>

<body>

<div class="title">Under The Same Moon 🌙💖</div>

<!-- 🎁 BUTTON -->
<button class="next-btn" onclick="goToVideo()">Special Surprise 🎥💝</button>

<!-- VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer()">
    <div class="circle-wrap">
        <img id="viewerImg">
    </div>
</div>

<script>
/* floating memories */
const memories=[
 {src:"/gg/photos/1.jpeg", text:"You & Me 🌙"},
 {src:"/gg/photos/2.jpeg", text:"Moonlight Smile ✨"},
 {src:"/gg/photos/3.jpeg", text:"Forever 💕"},
 {src:"/gg/photos/4.jpeg", text:"My Peace 🤍"},
 {src:"/gg/photos/5.jpeg", text:"Always Us 🧿"}
];

const cards=[];
const W=()=>innerWidth;
const H=()=>innerHeight;

memories.forEach(p=>{
    const box=document.createElement("div");
    box.className="memory";

    const size=W()<600?60:90;
    box.style.width=size+"px";
    box.style.height=size*1.35+"px";

    box.innerHTML=`<img src="${p.src}"><div class="caption">${p.text}</div>`;
    document.body.appendChild(box);

    const obj={
        el: box,
        x: Math.random()*(W()-size),
        y: Math.random()*(H()-size),
        vx:(Math.random()-0.5)*0.5,
        vy:(Math.random()-0.5)*0.5,
        size
    };
    cards.push(obj);

    box.onclick=e=>{
        e.stopPropagation();
        openViewer(p.src);
    };
});

function animate(){
    cards.forEach(c=>{
        c.x+=c.vx;
        c.y+=c.vy;
        if(c.x<0||c.x>W()-c.size) c.vx*=-1;
        if(c.y<0||c.y>H()-c.size*1.35) c.vy*=-1;
        c.el.style.transform=`translate(${c.x}px,${c.y}px)`;
    });
    requestAnimationFrame(animate);
}
animate();

/* viewer */
function openViewer(src){
    viewerImg.src=src;
    viewer.style.display="flex";
}
function closeViewer(){
    viewer.style.display="none";
}

/* go to video page */
function goToVideo(){
    window.location.href="/ne/video.html"; // 👈 apna video page
}
</script>

</body>
</html>
