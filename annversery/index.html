  <script>
    window.onload = function () {

        // ███ FIX: SAFE AUDIO AUTOPLAY ███
        const audio = document.getElementById("myAudio");
        audio.volume = 1.0;

        function tryPlay() {
            audio.play().then(() => {
                console.log("Audio started successfully");
            }).catch(() => {
                console.log("Autoplay blocked. Waiting for user tap...");
                document.body.addEventListener("click", tryPlay, { once: true });
            });
        }

        tryPlay();

        // ███ CANVAS EFFECTS ███
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function random(min, max) { return Math.random() * (max - min) + min; }

        function Firework() {
            this.x = random(0, canvas.width);
            this.y = random(0, canvas.height);
            this.radius = random(2, 4);
            this.color = `hsl(${random(0, 360)}, 100%, 50%)`;
            this.vx = random(-2, 2);
            this.vy = random(-2, 2);
            this.life = 80;
        }

        Firework.prototype.draw = function () {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        };

        Firework.prototype.update = function () {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        };

        function Heart() {
            this.x = random(0, canvas.width);
            this.y = canvas.height + 20;
            this.size = random(20, 35);
            this.opacity = 1;
            this.vy = random(-1.5, -0.5);
        }

        Heart.prototype.draw = function () {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.bezierCurveTo(this.x - this.size, this.y - this.size,
                this.x - this.size * 1.4, this.y + this.size / 2,
                this.x, this.y + this.size);

            ctx.bezierCurveTo(this.x + this.size * 1.4, this.y + this.size / 2,
                this.x + this.size, this.y - this.size,
                this.x, this.y);

            ctx.fillStyle = "rgba(255,0,80," + this.opacity + ")";
            ctx.fill();
        };

        Heart.prototype.update = function () {
            this.y += this.vy;
            this.opacity -= 0.01;
        };

        let fireworks = [];
        let hearts = [];

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.1) fireworks.push(new Firework());
            if (Math.random() < 0.07) hearts.push(new Heart());

            fireworks = fireworks.filter(f => {
                f.draw();
                f.update();
                return f.life > 0;
            });

            hearts = hearts.filter(h => {
                h.draw();
                h.update();
                return h.opacity > 0;
            });

            requestAnimationFrame(animate);
        }

        animate();
    };
</script>
