<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Game 💖</title>
<link rel="stylesheet" href="/romantic-os/css/style.css">
<style>
    
body{background:#ffccd5; font-family:"Poppins",sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100vh;}
h2{text-align:center; margin:20px;}
#gameBoard{display:grid; grid-template-columns:repeat(3,100px); grid-template-rows:repeat(3,100px); gap:10px;}
.cell{width:100px; height:100px; background: rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:36px; border-radius:15px; cursor:pointer; transition:0.2s;}
.cell:hover{transform:scale(1.05); background: rgba(255,0,100,0.2);}
#message{margin-top:20px; font-size:18px; text-align:center;}
#modeSelect{margin:15px; font-size:16px; padding:5px 10px; border-radius:10px; outline:none;}
button#resetBtn{margin-top:20px; padding:10px 20px; border-radius:12px; background:#ff4da6; color:#fff; font-weight:500; border:none; cursor:pointer;}
</style>
</head>
<body>

<h2>💖 Love Game 💖</h2>
<button id="backBtn" style="
  margin:10px;
  padding:8px 15px;
  border-radius:12px;
  background:#ff4da6;
  color:#fff;
  font-weight:500;
  border:none;
  cursor:pointer;
">⬅ Back</button>

<select id="modeSelect">
  <option value="2player">Two Player</option>
  <option value="computer">Vs Computer</option>
</select>

<div id="gameBoard"></div>
<div id="message"></div>
<button id="resetBtn">Play Again</button>

<script>
const board = ["","","","","","","","",""];
const boardEl = document.getElementById("gameBoard");
const messageEl = document.getElementById("message");
const modeSelect = document.getElementById("modeSelect");
const resetBtn = document.getElementById("resetBtn");
let currentPlayer = "💖";
let gameOver = false;

// WIN COMBINATIONS
const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

// CREATE CELLS
function createBoard(){
  boardEl.innerHTML="";
  for(let i=0;i<9;i++){
    const cell = document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.index = i;
    cell.addEventListener("click", playerMove);
    boardEl.appendChild(cell);
  }
}
createBoard();

// PLAYER MOVE
function playerMove(e){
  const idx = e.target.dataset.index;
  if(board[idx]!=="" || gameOver) return;
  board[idx]=currentPlayer;
  e.target.innerText=currentPlayer;
  checkWin();
  if(!gameOver){
    currentPlayer = currentPlayer==="💖"?"💗":"💖";
    if(modeSelect.value==="computer" && currentPlayer==="💗"){
      computerMove();
    }
  }
}

// COMPUTER MOVE
function computerMove(){
  let empty = board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
  let choice = empty[Math.floor(Math.random()*empty.length)];
  board[choice]="💗";
  boardEl.children[choice].innerText="💗";
  checkWin();
  currentPlayer="💖";
}

// CHECK WIN
function checkWin(){
  let winner=null;
  for(let win of wins){
    const [a,b,c]=win;
    if(board[a] && board[a]===board[b] && board[b]===board[c]){
      winner=board[a];
      break;
    }
  }
  if(winner){
    gameOver=true;
    if(winner==="💖") messageEl.innerText="🎉 You Win! Your love ❤️ is victorious!";
    else messageEl.innerText="💌 Computer Wins! But love always finds a way 😘";
  } else if(board.every(c=>c!=="")){
    gameOver=true;
    messageEl.innerText="🤗 It's a tie! Love is still in the air 💕";
  } else{
    messageEl.innerText = currentPlayer==="💖"?"💖 Your turn!":"💗 "+(modeSelect.value==="computer"?"Computer's turn":"Player 2 turn");
  }
}

// RESET
resetBtn.addEventListener("click", ()=>{
  for(let i=0;i<9;i++) board[i]="";
  gameOver=false;
  currentPlayer="💖";
  createBoard();
  messageEl.innerText = "💖 Your turn!";
});
document.getElementById("backBtn").addEventListener("click", ()=>{
  window.location.href="/romantic-os/home.html"; // Back to home page
});
</script>
</body>
</html>
