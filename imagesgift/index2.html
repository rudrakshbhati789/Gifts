<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Biwii ❤️ Gift</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#0b0b0b;
 font-family:Poppins,system-ui;
 color:white;
 overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
 position:fixed; inset:0;
 background:radial-gradient(circle,#1a001a,#000);
 display:flex; flex-direction:column;
 justify-content:center; align-items:center;
 text-align:center; padding:20px;
 z-index:300;
}
#introText{
 font-size:1rem; line-height:1.6;
 color:#ffb6dc;
 max-width:92%;
 border-right:2px solid pink;
 white-space:pre-line; overflow:hidden;
}
#startBtn{
 margin-top:24px;
 padding:12px 26px;
 border:none; border-radius:30px;
 background:linear-gradient(45deg,hotpink,deeppink);
 color:white;
 box-shadow:0 0 25px hotpink;
 font-size:1rem; display:none;
}

/* ================= FLOAT BG ================= */
.float{
 position:fixed;
 bottom:-40px;
 font-size:16px;
 color:rgba(255,105,180,.7);
 animation:floatUp linear forwards;
 pointer-events:none;
}
@keyframes floatUp{
 from{transform:translateY(0);opacity:1}
 to{transform:translateY(-120vh);opacity:0}
}

/* ================= CARDS ================= */
.card{
 position:absolute;
 width:22vw; max-width:120px;
 aspect-ratio:3/4;
 border-radius:16px;
 object-fit:cover;
 box-shadow:0 12px 25px rgba(255,105,180,.6);
 opacity:0;
 transition:1.6s ease;
}

/* ================= CENTER TEXT ================= */
#centerText{
 position:fixed;
 top:62%; left:50%;
 transform:translateX(-50%);
 width:90%;
 text-align:center;
 font-size:.95rem;
 color:pink;
 opacity:0;
}

/* ================= GRID ================= */
#grid{
 position:fixed; inset:0;
 padding:16px;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(85px,1fr));
 gap:14px;
 overflow-y:auto;
 opacity:0;
 background:#0b0b0b;
}
#grid img{
 width:100%;
 border-radius:14px;
 box-shadow:0 0 15px rgba(255,105,180,.4);
}

/* ================= VIEWER ================= */
#viewer{
 position:fixed; inset:0;
 background:rgba(0,0,0,.85);
 display:none;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 z-index:200;
}
#viewer img{
 width:65vw; max-width:220px;
 border-radius:20px;
 box-shadow:0 0 40px hotpink;
}
#viewerText{
 margin-top:12px;
 font-size:.95rem;
 border-right:2px solid pink;
 white-space:nowrap;
 overflow:hidden;
}

/* ================= REACTIONS ================= */
#reactions{
 position:fixed;
 bottom:16px; left:50%;
 transform:translateX(-50%);
 display:flex; gap:14px;
 z-index:250;
}
.react{
 font-size:26px;
 cursor:pointer;
 transition:.2s;
}
.react:active{transform:scale(1.3)}

/* ================= NAMES PAGE ================= */
#namesPage{
 position:fixed; inset:0;
 background:radial-gradient(circle,#1a001a,#000);
 display:none;
 flex-direction:column;
 align-items:center;
 overflow-y:auto;
 padding:30px 20px;
 z-index:260;
}
#namesPage h2{
 color:#ff9ad5;
 margin-bottom:20px;
}
.name{
 padding:14px 22px;
 margin-bottom:14px;
 background:rgba(255,105,180,.15);
 border-radius:22px;
 box-shadow:0 0 18px rgba(255,105,180,.45);
 font-size:1rem;
 cursor:pointer;
 transition:.35s ease;
 text-align:center;
}
.name:hover,.name:active{
 transform:scale(1.12);
 background:hotpink;
}
#nameMessage{
 margin-top:20px;
 min-height:80px;
 color:#ffb6dc;
 font-size:.95rem;
 border-right:2px solid pink;
 white-space:pre-line;
 text-align:center;
}
#closeNames{
 margin-top:24px;
 padding:10px 24px;
 border:none;
 border-radius:22px;
 background:hotpink;
 color:white;
}

/* ================= MOBILE ================= */
@media(max-width:480px){
 .card{width:26vw}
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
 <div id="introText"></div>
 <button id="startBtn" onclick="startGift()">Open My Surprise 💖</button>
</div>

<div id="centerText"></div>
<div id="grid"></div>

<!-- VIEWER -->
<div id="viewer" onclick="this.style.display='none'">
 <img id="viewerImg">
 <div id="viewerText"></div>
</div>

<!-- REACTIONS -->
<div id="reactions">
 <div class="react" onclick="react('❤️')">❤️</div>
 <div class="react" onclick="react('😍')">😍</div>
 <div class="react" onclick="react('🥰')">🥰</div>
 <div class="react" onclick="react('💖')">💖</div>
 <div class="react" onclick="openNames()">💌</div>
</div>

<!-- NAMES PAGE -->
<div id="namesPage">
 <h2>Names I Call You 💖</h2>

 <div class="name">Biwii 🧿</div>
 <div class="name">Bubuuu 🥺</div>
 <div class="name">Jaan ❤️</div>
 <div class="name">Baby 💕</div>
 <div class="name">My Peace ✨</div>
 <div class="name">My Home 🏡</div>

 <div id="nameMessage"></div>
 <button id="closeNames" onclick="closeNames()">Close 💖</button>
</div>

<script>
/* ================= DATA ================= */
const data=[
 {img:"/imagesgift/images/2.jpeg",text:"Biwii ❤️ tum meri sabse pyari kahani ho"},
 {img:"/imagesgift/images/3.jpeg",text:"Tumhari smile mera sukoon hai"},
 {img:"/imagesgift/images/7.jpeg",text:"Tum saath ho to sab easy lagta hai"},
 {img:"/imagesgift/images/8.jpeg",text:"Is saal ka best gift tum ho"},
 {img:"/imagesgift/images/9.jpeg",text:"Tum meri aadat ban chuki ho"},
 {img:"/imagesgift/images/10.jpeg",text:"Tum ho to ghar jaisa lagta hai"},
 {img:"/imagesgift/images/11.jpeg",text:"Tum meri peace ho Biwii"},
 {img:"/imagesgift/images/12.jpeg",text:"Tumse milke zindagi badal gayi"},
 {img:"/imagesgift/images/13.jpeg",text:"Forever ka matlab tum"},
 {img:"/imagesgift/images/15.jpeg",text:"Always yours 💖"}
];

/* ================= INTRO TEXT ================= */
const introMsg=`Hey Biwii ❤️
Ye sirf photos nahi hain…
Ye wo ehsaas hain jo main
har din mehsoos karta hoon ✨`;

let it=0;
const introText=document.getElementById("introText");
const startBtn=document.getElementById("startBtn");

let introTimer=setInterval(()=>{
 introText.innerHTML+=introMsg[it++];
 if(it>=introMsg.length){
  clearInterval(introTimer);
  startBtn.style.display="block";
 }
},45);

/* ================= FLOAT BACKGROUND ================= */
setInterval(()=>{
 let f=document.createElement("div");
 f.className="float";
 f.innerHTML=Math.random()>.5?"❤️":"I Love You";
 f.style.left=Math.random()*100+"vw";
 f.style.animationDuration=3+Math.random()*4+"s";
 document.body.appendChild(f);
 setTimeout(()=>f.remove(),7000);
},350);

/* ================= START GIFT ================= */
const cards=[],centerText=document.getElementById("centerText");

function startGift(){
 document.getElementById("intro").style.display="none";

 data.forEach((d,i)=>{
  let img=document.createElement("img");
  img.src=d.img;
  img.className="card";
  img.style.top=i%2?"58%":"28%";
  img.style.left="-160px";
  document.body.appendChild(img);
  cards.push(img);
 });

 cards.forEach((c,i)=>{
  setTimeout(()=>{
   c.style.opacity=1;
   c.style.left="110%";
  },i*220);
 });

 setTimeout(()=>{
  cards.forEach((c,i)=>{
   setTimeout(()=>c.style.left="-160px",i*220);
  });
 },3200);

 setTimeout(showCenter,6500);
}

/* ================= CENTER SLIDESHOW ================= */
function showCenter(){
 let i=0;
 function next(){
  if(i>=cards.length){showGrid();return;}
  let c=cards[i];
  c.style.left="50%";
  c.style.top="38%";
  c.style.transform="translate(-50%,-50%) scale(.85)";
  c.style.opacity=1;

  centerText.innerHTML="";
  centerText.style.opacity=1;
  let msg=data[i].text,j=0;
  let t=setInterval(()=>{
   centerText.innerHTML+=msg[j++];
   if(j>=msg.length)clearInterval(t);
  },50);

  setTimeout(()=>{
   c.style.opacity=0;
   centerText.style.opacity=0;
   i++; next();
  },2200);
 }
 next();
}

/* ================= GRID ================= */
function showGrid(){
 cards.forEach(c=>c.remove());
 grid.style.opacity=1;
 data.forEach(d=>{
  let img=document.createElement("img");
  img.src=d.img;
  img.onclick=()=>openViewer(d.img,d.text);
  grid.appendChild(img);
 });
}

/* ================= VIEWER ================= */
function openViewer(src,text){
 viewer.style.display="flex";
 viewerImg.src=src;
 viewerText.innerHTML="";
 let i=0;
 let t=setInterval(()=>{
  viewerText.innerHTML+=text[i++];
  if(i>=text.length)clearInterval(t);
 },70);
}

/* ================= REACTIONS ================= */
function react(e){
 let r=document.createElement("div");
 r.className="float";
 r.innerHTML=e;
 r.style.left=Math.random()*100+"vw";
 r.style.fontSize=30+Math.random()*20+"px";
 r.style.animationDuration=2+Math.random()*2+"s";
 document.body.appendChild(r);
 setTimeout(()=>r.remove(),4000);
}

/* ================= NAMES PAGE ================= */
const nameTexts={
 "Biwii 🧿":"Biwii ❤️\nTum meri zindagi ka sabse pyara hissa ho.\nI Love You Biwi💖",
 "Bubuuu 🥺":"Bubuuu 🥺\nTum meri weakness aur strength dono ho.\nI Love You Bubuuu💞",
 "Jaan ❤️":"Jaan ❤️\nTumhare bina kuch bhi complete nahi.\nI Love You Jaan🫶",
 "Baby 💕":"Baby 💕\nTum meri duniya ho.\nI Love You 😘",
 "My Peace ✨":"My Peace ✨\nTum ho to sab shant lagta hai.\nI Love You 🌙",
 "My Home 🏡":"My Home 🏡\nTum hi mera ghar ho.\nI Love You Forever 🏠💖"
};

let nameTimer;
document.querySelectorAll(".name").forEach(n=>{
 n.onclick=()=>{
  typeNameText(nameTexts[n.innerText]);
 };
});

function typeNameText(msg){
 const box=document.getElementById("nameMessage");
 box.innerHTML="";
 clearInterval(nameTimer);
 let i=0;
 nameTimer=setInterval(()=>{
  box.innerHTML+= msg[i]==="\n"?"<br>":msg[i];
  i++;
  if(i>=msg.length) clearInterval(nameTimer);
 },45);
}

function openNames(){
 document.getElementById("namesPage").style.display="flex";
}
function closeNames(){
 document.getElementById("namesPage").style.display="none";
}
</script>

</body>
</html>
