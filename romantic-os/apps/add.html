<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Add Reel</title>
<style>
body{
  background:#000;
  color:white;
  font-family:Poppins;
  text-align:center;
}
input{
  width:90%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:40px;
}
button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:20px;
  background:#ff4da6;
  color:white;
}
</style>
</head>
<body>

<h2>Add Instagram Reel ❤️</h2>

<input id="link" placeholder="Paste Instagram Reel Link">
<br>
<button onclick="save()">Save Reel</button>

<script>
function save(){
  let link=document.getElementById("link").value;
  if(!link.includes("instagram.com")){
    alert("Invalid Instagram link");
    return;
  }

  let reels=JSON.parse(localStorage.getItem("reels")||"[]");
  reels.push(link);
  localStorage.setItem("reels",JSON.stringify(reels));
  alert("Reel Saved ❤️");
  location.href="/romantic-os/apps/reel.html";
}
</script>

</body>
</html>
