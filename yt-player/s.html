<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Page</title>
    <style>
        body{
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to right, #ffdde1, #ffc0cb);
            position: relative;
            height: 100vh;
            font-family: "Poppins", sans-serif;
            transition: opacity 1.5s ease;
        }

        /* Floating Fog */
        .fog{
            position: absolute;
            width: 300px;
            height: 200px;
            background: pink;
            opacity: 0.25;
            border-radius: 50%;
            filter: blur(60px);
            animation: drift 10s infinite linear;
        }
        @keyframes drift{
            0%{ transform: translateY(0) translateX(0);}
            50%{ transform: translateY(-40px) translateX(40px);}
            100%{ transform: translateY(0) translateX(0);}
        }

        /* Falling Hearts */
        .heart{
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity:1; }
            100% { transform: translateY(110vh) translateX(20px); opacity:0; }
        }

        /* Typewriter Floating Text */
        h1 {
            position: absolute;
            top: 35%;
            width: 100%;
            text-align: center;
            font-size: 28px;
            color: #d30069;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #d30069;
            width: 0;
            animation: typing 4s steps(40) 1s forwards, float 4s ease-in-out infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 80%; }
        }

        @keyframes float {
            0%{ transform: translateY(0px); }
            50%{ transform: translateY(-20px); }
            100%{ transform: translateY(0px); }
        }

        /* Button */
        button{
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            font-size: 18px;
            color: white;
            background: #ff3e7f;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 0 15px #ff3e7f;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse{
            0%{ transform: translateX(-50%) scale(1); }
            50%{ transform: translateX(-50%) scale(1.15); }
            100%{ transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>

    <!-- Fog -->
    <div class="fog" style="top:10%; left:10%; animation-duration:12s;"></div>
    <div class="fog" style="top:40%; left:60%; animation-duration:15s;"></div>
    <div class="fog" style="top:70%; left:20%; animation-duration:18s;"></div>

    <!-- Typewriter -->
    <h1>I Love You Mere Pyare Biwi 🥰🫀</h1>

    <!-- Button -->
    <button onclick="goNext()">Click to Continue 💗</button>

    <script>
        // Falling Hearts
        function createHeart(){
            let heart = document.createElement("div");
            heart.innerHTML = "💗";
            heart.classList.add("heart");

            heart.style.left = Math.random()*100 + "vw";
            heart.style.animationDuration = (3 + Math.random()*5) + "s";

            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(), 8000);
        }
        setInterval(createHeart, 300);

        // Fade + Next Page
        function goNext(){
            document.body.style.opacity = "0"; // Fade out effect
            setTimeout(()=>{
                window.location.href = "/yt-player/index.html"; // Next page
            }, 1500); // same as transition time
        }
    </script>

</body>
</html>
