<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Puzzle 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Poppins,system-ui;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* CARD */
.card{
  width:320px;
  background:#ffffffee;
  padding:16px;
  border-radius:20px;
  text-align:center;
}

/* BUTTON */
button{
  padding:14px;
  width:100%;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  font-size:17px;
  margin-top:12px;
}

/* PREVIEW */
#preview{display:none}
#preview img{
  width:100%;
  border-radius:16px;
}

/* GAME */
#game{display:none}
#puzzle{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  margin-top:15px;
}
.piece{
  width:100%;
  aspect-ratio:1/1;
  border-radius:8px;
  background-size:300px 300px;
}
.selected{
  outline:3px solid #ff4d6d;
}

/* LOVE PAGE */
#lovePage{
  display:none;
  position:fixed;
  inset:0;
  color:white;
  text-align:center;
  padding:25px;
}
#lovePage video{
  width:180px;
  border-radius:14px;
  margin:16px auto;
  display:block;
}

/* EMOJI */
.emoji{
  position:absolute;
  font-size:24px;
  animation:float 6s linear infinite;
}
@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-20vh)}
}

/* LEVEL MODAL */
#levelModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:999;
}
.levelBox{
  background:white;
  width:90%;
  max-width:360px;
  margin:8vh auto;
  border-radius:20px;
  padding:16px;
}
.levelGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.level{
  background:#ff4d6d;
  color:white;
  padding:10px 0;
  border-radius:12px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- START -->
<div id="startScreen" class="card">
  <h2>💖 Our Memories</h2>
  <p>20 puzzles, 20 reasons why I love you ❤️</p>
  <button onclick="startGame()">▶ Start / Continue</button>
  <button onclick="openLevels()">📂 Select Level</button>
</div>

<!-- PREVIEW -->
<div id="preview" class="card">
  <h3>💞 Yaad Rakho Is Photo Ko</h3>
  <img id="previewImg">
</div>

<!-- GAME -->
<div id="game" class="card">
  <h3>🧩 Complete Our Memory</h3>
  <div id="puzzle"></div>
</div>

<!-- LOVE PAGE -->
<div id="lovePage">
  <h1 id="loveTitle"></h1>
  <video id="loveVideo" autoplay loop muted playsinline></video>
  <p id="loveText"></p>
</div>

<!-- LEVEL SELECT -->
<div id="levelModal">
  <div class="levelBox">
    <h3>Select Any Level ❤️</h3>
    <div class="levelGrid" id="levelGrid"></div>
    <button onclick="closeLevels()">Close</button>
  </div>
</div>

<script>
/* DATA */
const images = Array.from({length:20},(_,i)=>`/images/${i+1}.jpeg`);
const videos = Array.from({length:20},(_,i)=>`/gif/${i+1}.mp4`);

const loveTexts = [
  "Tum meri pehli aur aakhri mohabbat ho ❤️",
  "Tumhari hasi meri duniya hai 💕",
  "Tum saath ho toh sab kuch perfect lagta hai 🥺",
  "Tum meri zindagi ka sabse khoobsurat hissa ho 💖",
  "Tumhari ek nazar hi kaafi hoti hai 🌸",
  "Tum meri har dua ka jawaab ho 💞",
  "Tumhare bina sab adhoora lagta hai 🫶",
  "Tum meri har khushi ki wajah ho 😘",
  "Tum meri aadat ban chuki ho ❤️",
  "Tum meri kahani ka best part ho 💓",
  "Tum meri zindagi me rang bhar deti ho 🌈",
  "Tum mere liye sab kuch ho 🥰",
  "Tumhari hasi meri jaan hai 💗",
  "Tumhara saath meri taqat hai 🫂",
  "Tum meri poori duniya ho 💝",
  "Tum meri har jeet ho 🌹",
  "Tum meri rooh ka sukoon ho 💘",
  "Tum meri sabse pyari aadat ho 🧸",
  "Tum meri zindagi ka magic ho ✨",
  "Tum meri forever ho 👑❤️"
];

const themes=[
"linear-gradient(135deg,#ff758c,#ff7eb3)",
"linear-gradient(135deg,#ff9a9e,#fad0c4)",
"linear-gradient(135deg,#fbc2eb,#a6c1ee)"
];

let index = 0;
let order=[...Array(9).keys()];
let correct=[...order];
let selected=null;

const puzzle=document.getElementById("puzzle");

/* START / RESUME */
function startGame(){
  index = parseInt(localStorage.getItem("loveIndex")) || 0;
  resetScreens();
  showPreview();
}

/* PREVIEW */
function showPreview(){
  document.getElementById("preview").style.display="block";
  document.getElementById("previewImg").src=images[index];
  setTimeout(()=>{
    document.getElementById("preview").style.display="none";
    document.getElementById("game").style.display="block";
    shuffle();
    create();
  },2500);
}

/* PUZZLE */
function shuffle(){ order.sort(()=>Math.random()-0.5); }

function create(){
  puzzle.innerHTML="";
  order.forEach((n,i)=>{
    const d=document.createElement("div");
    d.className="piece";
    d.style.backgroundImage=`url(${images[index]})`;
    d.style.backgroundPosition=`${-(n%3)*100}px ${-Math.floor(n/3)*100}px`;
    d.onclick=()=>{
      if(selected===null){
        selected=i;
        d.classList.add("selected");
      }else{
        [order[selected],order[i]]=[order[i],order[selected]];
        selected=null;
        create();
        check();
      }
    };
    puzzle.appendChild(d);
  });
}

function check(){
  if(order.every((v,i)=>v===correct[i])){
    localStorage.setItem("loveIndex", index+1);
    setTimeout(showLove,500);
  }
}

/* LOVE PAGE */
function showLove(){
  resetScreens();
  const lp=document.getElementById("lovePage");
  lp.style.background=themes[index%themes.length];
  document.getElementById("loveTitle").innerText=`Love ${index+1} 💖`;
  document.getElementById("loveVideo").src=videos[index];
  document.getElementById("loveText").innerText=loveTexts[index];
  lp.style.display="block";
  hearts();
  setTimeout(nextLevel,9000);
}

/* NEXT LEVEL */
function nextLevel(){
  index++;
  if(index>=images.length){
    localStorage.removeItem("loveIndex");
    window.location.href="/Romantic-os2.0/love.html";
    return;
  }
  resetScreens();
  showPreview();
}

/* LEVEL SELECT (ALL UNLOCKED) */
function openLevels(){
  const grid=document.getElementById("levelGrid");
  grid.innerHTML="";
  images.forEach((_,i)=>{
    const b=document.createElement("div");
    b.className="level";
    b.innerText=i+1;
    b.onclick=()=>{
      index=i;
      localStorage.setItem("loveIndex",index);
      closeLevels();
      resetScreens();
      showPreview();
    };
    grid.appendChild(b);
  });
  document.getElementById("levelModal").style.display="block";
}
function closeLevels(){
  document.getElementById("levelModal").style.display="none";
}

/* UTILS */
function resetScreens(){
  ["startScreen","preview","game","lovePage"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  order=[...correct];
  selected=null;
}

function hearts(){
  const arr=["❤️","💖","💕","✨","🥰"];
  for(let i=0;i<15;i++){
    const e=document.createElement("div");
    e.className="emoji";
    e.innerText=arr[Math.floor(Math.random()*arr.length)];
    e.style.left=Math.random()*100+"%";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),6000);
  }
}
</script>

</body>
</html>
