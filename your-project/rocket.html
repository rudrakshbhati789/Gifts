<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Rocket 🚀</title>
<style>
/* Full screen body */
body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: "Poppins", sans-serif;
    background: url('index-bg.jpg') no-repeat center center fixed; /* Your index page snapshot or background */
    background-size: cover;
}

/* Rocket container */
#rocket {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    cursor: pointer;
}

/* Rocket image */
#rocket img {
    width: 100%;
    display: block;
}

/* Flame animation */
.flame {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 40px;
    background: radial-gradient(circle, #ff4f4f, #ff0000);
    border-radius: 50%;
    animation: flameFlicker 0.1s infinite alternate;
}

/* Flame flicker */
@keyframes flameFlicker {
    from { transform: translateX(-50%) scaleY(1); opacity:1; }
    to { transform: translateX(-50%) scaleY(1.5); opacity:0.8; }
}

/* Hearts trail */
.heart {
    position: absolute;
    font-size: 20px;
    color: #ff77ff;
    pointer-events: none;
    animation: floatHeart 2s linear forwards;
}

/* Hearts float up */
@keyframes floatHeart {
    from { transform: translateY(0) scale(1); opacity:1; }
    to { transform: translateY(-150px) scale(1.5); opacity:0; }
}

/* Rocket upward animation */
@keyframes rocketUp {
    0% { bottom: 0; transform: translateX(-50%) rotate(0deg); }
    25% { transform: translateX(-50%) rotate(-5deg); }
    50% { transform: translateX(-50%) rotate(5deg); }
    100% { bottom: 110%; transform: translateX(-50%) rotate(0deg); }
}
</style>
</head>
<body>

<!-- Rocket -->
<div id="rocket">
    <img src="rocket.png" alt="Love Rocket">
    <div class="flame"></div>
</div>

<script>
// Get rocket
const rocket = document.getElementById("rocket");

// Launch rocket on click
rocket.onclick = () => {
    rocket.style.animation = "rocketUp 5s ease-in forwards";

    // Hearts trail interval
    let heartInterval = setInterval(() => {
        let h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "💖";
        h.style.left = (rocket.offsetLeft + 30 + (Math.random()*20 -10)) + "px";
        h.style.bottom = rocket.offsetTop + "px";
        document.body.appendChild(h);

        // Remove heart after animation
        setTimeout(()=> h.remove(), 2000);
    }, 100);

    // Stop creating hearts after rocket animation
    setTimeout(() => clearInterval(heartInterval), 5000);
};
</script>

</body>
</html>
