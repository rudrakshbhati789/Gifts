<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartbeat Photo Hearts</title>
<style>
body {
  margin:0;
  height:100vh;
  overflow:hidden;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Poppins",sans-serif;
  position:relative;
}

/* TEXT */
h1 {
  position:absolute;
  top:4vh;
  width:100%;
  text-align:center;
  color:white;
  font-size:6vw;
  text-shadow:0 0 20px #fff;
}

.couple {
  position:absolute;
  top:12vh;
  width:100%;
  text-align:center;
  font-size:4vw;
  font-weight:700;
  color:white;
  text-shadow:0 0 10px #ff69b4;
}

/* IMAGE HEART */
.heart {
  position:absolute;
  width:180px;
  height:180px;
  mask:url('heart.svg');
  -webkit-mask:url('heart.svg');
  mask-size:100% 100%;
  -webkit-mask-size:100% 100%;
  border-radius: 20px;
  background-size:cover;
  background-position:center;
  transition:0.2s ease;
}

/* Red glow */
.redGlow {
  box-shadow: 0 0 25px red, 0 0 50px rgba(255,0,0,0.7);
  border:3px solid rgba(255,0,0,0.7);
}

/* Blue glow */
.blueGlow {
  box-shadow: 0 0 25px cyan, 0 0 50px rgba(0,255,255,0.7);
  border:3px solid rgba(0,255,255,0.7);
}

/* CANVAS */
#trailCanvas {
  position:absolute;
  inset:0;
  pointer-events:none;
}
</style>
</head>

<body>

<h1>Our Hearts ❤️</h1>
<div class="couple">Rudra ❤️ Ishika</div>

<div class="heart redGlow" id="heart1"></div>
<div class="heart blueGlow" id="heart2"></div>

<canvas id="trailCanvas"></canvas>

<script>
/* ADD YOUR IMAGES HERE */
heart1.style.backgroundImage = "url('YOUR_RED_HEART.jpg')";
heart2.style.backgroundImage = "url('YOUR_BLUE_HEART.jpg')";

const canvas = document.getElementById("trailCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resizeCanvas();
addEventListener("resize", resizeCanvas);

/* POSITIONS */
let pos1 = {x: innerWidth*0.25, y: innerHeight*0.55};
let pos2 = {x: innerWidth*0.65, y: innerHeight*0.55};

let speed1 = {x:1, y:1};
let speed2 = {x:-1, y:-1};

let trail1 = [], trail2 = [];
let waveOffset = 0;

/* MAIN ANIMATION */
function animate(){
  
  const h1 = heart1.clientWidth;
  const h2 = heart2.clientWidth;

  /* MOVEMENT */
  pos1.x += speed1.x;
  pos1.y += speed1.y;
  pos2.x += speed2.x;
  pos2.y += speed2.y;

  /* BOUNCE */
  if(pos1.x<0 || pos1.x>innerWidth-h1) speed1.x*=-1;
  if(pos1.y<0 || pos1.y>innerHeight-h1) speed1.y*=-1;
  if(pos2.x<0 || pos2.x>innerWidth-h2) speed2.x*=-1;
  if(pos2.y<0 || pos2.y>innerHeight-h2) speed2.y*=-1;

  /* APPLY POS */
  heart1.style.left = pos1.x+"px";
  heart1.style.top  = pos1.y+"px";
  heart2.style.left = pos2.x+"px";
  heart2.style.top  = pos2.y+"px";

  /* DISTANCE */
  const dx = pos2.x - pos1.x;
  const dy = pos2.y - pos1.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  /* --- 💗 PROXIMITY EFFECT SYSTEM --- */

  const maxClose = 300; // distance jaha effect strongest
  let lovePower = Math.max(0, 1 - dist/maxClose); // 0 → far, 1 → very close

  // SCALE
  const scale = 1 + lovePower*0.4;
  heart1.style.transform = `scale(${scale})`;
  heart2.style.transform = `scale(${scale})`;

  // GLOW BOOST
  heart1.style.boxShadow = `0 0 ${25 + lovePower*40}px red`;
  heart2.style.boxShadow = `0 0 ${25 + lovePower*40}px cyan`;

  // BORDER BRIGHTER
  heart1.style.borderColor = `rgba(255,0,0,${0.6 + lovePower*0.4})`;
  heart2.style.borderColor = `rgba(0,255,255,${0.6 + lovePower*0.4})`;

  // SPEED REDUCE (romantic slow motion)
  speed1.x *= (0.99 + (1-lovePower)*0.01);
  speed1.y *= (0.99 + (1-lovePower)*0.01);
  speed2.x *= (0.99 + (1-lovePower)*0.01);
  speed2.y *= (0.99 + (1-lovePower)*0.01);

  // TRAIL
  trail1.push({x: pos1.x+h1/2 , y: pos1.y+h1/2});
  trail2.push({x: pos2.x+h2/2 , y: pos2.y+h2/2});
  if(trail1.length>40) trail1.shift();
  if(trail2.length>40) trail2.shift();

  drawCanvas(dist, lovePower);
  requestAnimationFrame(animate);
}

/* CANVAS DRAW */
function drawCanvas(dist, lovePower){
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawTrail(trail1,"255,0,0");
  drawTrail(trail2,"0,255,255");

  drawWave(lovePower);
}

function drawTrail(trail,color){
  trail.forEach((t,i)=>{
    ctx.beginPath();
    ctx.arc(t.x,t.y,i/4,0,Math.PI*2);
    ctx.fillStyle = `rgba(${color},${i/40})`;
    ctx.shadowColor = `rgba(${color},1)`;
    ctx.shadowBlur = 20;
    ctx.fill();
  });
}

/* WAVE BETWEEN HEARTS */
function drawWave(lovePower){
  const x1 = pos1.x + heart1.clientWidth/2;
  const y1 = pos1.y + heart1.clientHeight/2;
  const x2 = pos2.x + heart2.clientWidth/2;
  const y2 = pos2.y + heart2.clientHeight/2;

  ctx.beginPath();
  for(let i=0;i<=60;i++){
    const t=i/60;
    const x = x1 + (x2-x1)*t;
    const mid = y1 + (y2-y1)*t;
    const amp = 25 * lovePower;
    const y = mid + Math.sin((t*8 + waveOffset)*Math.PI*2) * amp;

    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }

  ctx.strokeStyle = `rgba(255,0,255,${lovePower})`;
  ctx.lineWidth = 4 * lovePower;
  ctx.shadowColor = `rgba(255,0,255,${lovePower})`;
  ctx.shadowBlur = 25 * lovePower;
  ctx.stroke();

  waveOffset += 0.07;
}

animate();
</script>

</body>
</html>
