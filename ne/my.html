<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    background: linear-gradient(135deg, rgba(255, 100, 150, 0.9), rgba(255, 150, 200, 0.4));
    overflow:hidden;
    font-family:'Poppins', sans-serif;
}

.hide{
    opacity:0;
    transform:translateY(20px);
}

.show{
    animation: fadeIn 1.5s forwards;
}

@keyframes fadeIn{
    to{ opacity:1; transform:translateY(0); }
}

h1{
    font-size:48px;
    color:white;
    text-align:center;
    text-shadow:
        0 0 10px #ff4da6,
        0 0 30px #ff1a8c,
        0 0 80px #ff1a8c;
    animation: glow 2s infinite alternate, float 4s infinite;
}

@keyframes glow{
    from{ text-shadow:0 0 10px #ff7abf; }
    to{ text-shadow:0 0 50px #ff1a8c; }
}

@keyframes float{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-20px); }
    100%{ transform:translateY(0); }
}

button{
    padding:15px 30px;
    border:none;
    border-radius:50px;
    font-size:18px;
    color:white;
    background:#ff4da6;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,77,166,0.7);
    transition:0.3s;
}

button:hover{ transform:scale(1.1); }

.heart{
    position:absolute;
    font-size:24px;
    animation: fly 3s linear forwards;
}

@keyframes fly{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-600px) scale(1.8); }
}

.surprise{
    display:none;
    text-align:center;
    color:white;
    font-size:30px;
    animation: fade 1.5s forwards;
}

@keyframes fade{
    from{ opacity:0; transform:scale(0.8); }
    to{ opacity:1; transform:scale(1); }
}
</style>
</head>

<body>

<h1 id="title" class="hide">Helooo Mere Jaan 💖</h1>
<button id="btn" class="hide" onclick="surprise()">Click Kroo Mere Jaan 😘</button>

<div class="surprise" id="msg">
    I Love You Sooo Much 💋<br>
    You Are My Forever ❤️🧿
</div>

<audio id="music" loop>
    <source src="/a2/">
</audio>

<script>
setTimeout(()=>{
    document.getElementById("title").classList.add("show");
    document.getElementById("btn").classList.add("show");
},2000);

function surprise(){
    document.getElementById("music").play();
    document.getElementById("msg").style.display="block";
    document.getElementById("title").innerText="Surpriseee 💘";

    for(let i=0;i<40;i++){
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="❤️";
        heart.style.left=Math.random()*100+"vw";
        heart.style.bottom="0px";
        heart.style.animationDuration=(2+Math.random()*2)+"s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),3000);
    }

    /* 👉 redirect to next page */
    setTimeout(()=>{
        window.location.href = "next.html";
    },1500);
}
</script>

</body>
</html>
