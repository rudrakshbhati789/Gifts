<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Puzzle 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Poppins,system-ui;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* CARD */
.card{
  width:320px;
  background:#ffffffee;
  padding:16px;
  border-radius:20px;
  text-align:center;
}

/* START */
#startScreen button{
  margin-top:20px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  font-size:18px;
}

/* PREVIEW */
#preview{display:none}
#preview img{
  width:100%;
  border-radius:15px;
}

/* GAME */
#game{display:none}
#puzzle{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  margin-top:15px;
}
.piece{
  width:100%;
  aspect-ratio:1/1;
  border-radius:8px;
  background-size:300px 300px;
  transition:transform .15s;
}
.selected{
  outline:3px solid #ff4d6d;
  transform:scale(0.95);
}

/* LOVE PAGE */
#lovePage{
  display:none;
  position:fixed;
  inset:0;
  color:white;
  text-align:center;
  padding:25px;
  animation:fade .8s ease;
  overflow:hidden;
}
#lovePage h1{margin-top:20px}
#lovePage video{
  width:180px;
  margin:20px auto;
  display:block;
  border-radius:12px;
}
#lovePage p{
  font-size:16px;
  line-height:1.5;
}

/* FLOATING EMOJIS */
.emoji{
  position:absolute;
  font-size:26px;
  animation:float 6s linear infinite;
  pointer-events:none;
}
@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-20vh)}
}
</style>
</head>

<body>

<!-- START -->
<div id="startScreen" class="card">
  <h2>💖 Our Memories</h2>
  <p>20 puzzles, 20 reasons why I love you 🥺</p>
  <button onclick="startGame()">▶ Start Love</button>
</div>

<!-- PREVIEW -->
<div id="preview" class="card">
  <h3>💞 Yaad Rakho Is Photo Ko</h3>
  <img id="previewImg">
  <p>🧠 Yaad rakhna jaan…</p>
</div>

<!-- GAME -->
<div id="game" class="card">
  <h3>🧩 Complete Our Memory</h3>
  <div id="puzzle"></div>
</div>

<!-- LOVE -->
<div id="lovePage">
  <h1 id="loveTitle"></h1>
  <video id="loveVideo" autoplay loop muted playsinline></video>
  <p id="loveText"></p>
</div>

<script>
/* ================= DATA ================= */
const images = Array.from({length:20},(_,i)=>`/images/${i+1}.jpeg`);
const videos = Array.from({length:20},(_,i)=>`/gif/${i+1}.mp4`);
const loveTexts = [
"Love 1 ❤️ Tum meri pehli muskaan ho subah ki.",
"Love 2 💕 Tumhari awaaz meri sukoon hai.",
"Love 3 🥺 Tum ho toh sab kuch perfect lagta hai.",
"Love 4 💖 Tum meri zindagi ka sabse pyara hissa ho.",
"Love 5 🌸 Tum bina bole bhi sab samajh leti ho.",
"Love 6 💞 Tum meri har dua ka jawaab ho.",
"Love 7 🫶 Tum saath ho toh darr nahi lagta.",
"Love 8 😘 Tum meri har khushi ki wajah ho.",
"Love 9 ❤️ Tum meri aadat ban chuki ho.",
"Love 10 💓 Tum meri kahani ka sabse khoobsurat part ho.",
"Love 11 🌈 Tum meri zindagi me rang bhar deti ho.",
"Love 12 🥰 Tum mere liye sab kuch ho.",
"Love 13 💗 Tumhari hasi meri jaan hai.",
"Love 14 🫂 Tumhara saath meri taqat hai.",
"Love 15 💝 Tum meri duniya ho.",
"Love 16 🌹 Tum meri har jeet ho.",
"Love 17 💘 Tum meri rooh ka sukoon ho.",
"Love 18 🧸 Tum meri sabse pyari aadat ho.",
"Love 19 ✨ Tum meri zindagi ka magic ho.",
"Love 20 👑 Tum meri forever ho, sirf meri ❤️"
];
const themes = ["linear-gradient(135deg,#ff758c,#ff7eb3)","linear-gradient(135deg,#ff9a9e,#fad0c4)","linear-gradient(135deg,#fbc2eb,#a6c1ee)","linear-gradient(135deg,#fddb92,#d1fdff)"];

/* ================= STATE ================= */
// Resume last level if available
let index = parseInt(localStorage.getItem("loveIndex")) || 0;
let img = images[index];
let order = [...Array(9).keys()];
let correct = [...order];
let selected = null;
const puzzle = document.getElementById("puzzle");

/* ================= GAME FUNCTIONS ================= */
function startGame(){
  document.getElementById("startScreen").style.display="none";
  showPreview();
}

function showPreview(){
  document.getElementById("preview").style.display="block";
  document.getElementById("previewImg").src=img;
  setTimeout(()=>{
    document.getElementById("preview").style.display="none";
    document.getElementById("game").style.display="block";
    shuffle();
    create();
  },3000);
}

function shuffle(){ order.sort(()=>Math.random()-0.5); }

function create(){
  puzzle.innerHTML="";
  order.forEach((n,i)=>{
    const d=document.createElement("div");
    d.className="piece";
    d.style.backgroundImage=`url(${img})`;
    d.style.backgroundPosition = `${-(n%3)*100}px ${-Math.floor(n/3)*100}px`;
    d.onclick=()=>{
      if(selected===null){ selected=i; d.classList.add("selected"); }
      else{
        [order[selected],order[i]]=[order[i],order[selected]];
        selected=null;
        create();
        check();
      }
    };
    puzzle.appendChild(d);
  });
}

function check(){
  if(order.every((v,i)=>v===correct[i])){
    setTimeout(showLove,500);
  }
}

/* ================= LOVE PAGE ================= */
function showLove(){
  document.getElementById("game").style.display="none";
  const love=document.getElementById("lovePage");
  love.style.background=themes[index%themes.length];
  document.getElementById("loveTitle").innerText=`Love ${index+1} 💖`;

  const video=document.getElementById("loveVideo");
  video.src=videos[index];
  video.play();

  document.getElementById("loveText").innerText=loveTexts[index];
  love.style.display="block";

  spawnEmojis(love);
  localStorage.setItem("loveIndex",index); // Save progress

  setTimeout(nextPuzzle,12000);
}

function spawnEmojis(container){
  const emojis=["❤️","💖","💕","✨","🥰","🌸"];
  for(let i=0;i<20;i++){
    const e=document.createElement("div");
    e.className="emoji";
    e.innerText=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=Math.random()*100+"%";
    e.style.animationDuration=4+Math.random()*4+"s";
    container.appendChild(e);
  }
}

/* ================= NEXT PUZZLE / FINAL PAGE ================= */
function nextPuzzle(){
  document.getElementById("lovePage").innerHTML=`
    <h1 id="loveTitle"></h1>
    <video id="loveVideo" autoplay loop muted playsinline></video>
    <p id="loveText"></p>
  `;
  document.getElementById("lovePage").style.display="none";

  index++;
  if(index>=images.length){
    localStorage.removeItem("loveIndex"); // Reset progress
    window.location.href = "/Romantic-os2.0/love.html"; // FINAL PAGE
    return;
  }

  img=images[index];
  order=[...correct];
  document.getElementById("game").style.display="none";
  showPreview();
}

/* ================= AUTO RESUME ON LOAD ================= */
window.onload = ()=>{
  if(index>0 && index<images.length){
    document.getElementById("startScreen").querySelector("p").innerText = "Continue from your last puzzle ❤️";
  }
};
</script>

</body>
</html>
