<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rudraksh ❤️ Ishika Car Race</title>
<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(to right, #ff9ecb, #ff5fa2, #ff2e63);
  font-family: 'Poppins', sans-serif;
}

.game-wrapper {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.road {
  width: 90%;
  height: 60%;
  position: relative;
  background: #222; 
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(255,255,255,0.4);
  overflow: hidden;
}

.finish-line {
  width: 10px;
  height: 100%;
  background: repeating-linear-gradient(
    white 0 10px,
    transparent 10px 20px
  );
  position: absolute;
  right: 0;
  top: 0;
  border-left: 2px solid #fff;
}

.car {
  width: 120px;
  position: absolute;
  filter: drop-shadow(0 0 15px #fff);
  transition: filter 0.2s;
}

.car.moving {
  filter: drop-shadow(0 0 25px #ffeb3b);
}

#car1 { top: 25%; left: 5%; }
#car2 { top: 60%; left: 5%; }

.controls {
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 20px;
  position: fixed;
  bottom: 10px;
  left: 0;
  padding: 0 10px;
  z-index: 50;
}

.control-btn {
  flex: 1;
  max-width: 45%;
  min-width: 120px;
  background: #ffffff;
  border: none;
  padding: 15px 0;
  border-radius: 15px;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 0 10px rgba(255,255,255,0.6);
  cursor: pointer;
  color: #ff2e63;
  text-align: center;
  touch-action: manipulation;
}

.floating-msg {
  position: absolute;
  top: 40%;
  width: 100%;
  text-align: center;
  font-size: 28px;
  color: #ffeb3b;
  text-shadow: 0 0 15px #f00;
  opacity: 0;
  animation: floatMsg 3s forwards;
  z-index: 30;
}

@keyframes floatMsg {
  0% { opacity: 0; transform: translateY(0); }
  10% { opacity: 1; }
  90% { opacity: 1; transform: translateY(-50px); }
  100% { opacity: 0; transform: translateY(-100px); }
}

.heart, .spark {
  position: absolute;
  font-size: 24px;
  animation: floatHeart 2s linear forwards;
}

.heart { color: #ff2e63; }
.spark { color: #fff; font-size: 16px; }

@keyframes floatHeart {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
}

#countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 80px;
  color: #ffeb3b;
  font-weight: bold;
  text-shadow: 0 0 20px #f00, 0 0 30px #ff2e63;
  z-index: 50;
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ffeb3b;
  opacity: 0.8;
  z-index: 100;
  pointer-events: none;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(300px) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="road">
    <div class="finish-line"></div>
  </div>

  <img src="/images/car.gif" id="car1" class="car" />
  <img src="/images/car 2.gif" id="car2" class="car" />

  <div class="controls">
    <button id="btnCar1" class="control-btn">Rudraksh 🚗💨</button>
    <button id="btnCar2" class="control-btn">Ishika 💖🚗</button>
  </div>

  <div id="countdown"></div>
</div>

<script>
const car1 = document.getElementById('car1');
const car2 = document.getElementById('car2');
const btn1 = document.getElementById('btnCar1');
const btn2 = document.getElementById('btnCar2');

let pos1 = 5, pos2 = 5;
const finish = 80;
let moveQueue1 = 0, moveQueue2 = 0;
let raceActive = false;

// Countdown
function startCountdown(callback) {
  const countdownEl = document.getElementById('countdown');
  let count = 3;
  countdownEl.innerText = count;
  countdownEl.style.display = "block";

  const interval = setInterval(() => {
    count--;
    if(count > 0) countdownEl.innerText = count;
    else if(count === 0) countdownEl.innerText = "GO! 🏁";
    else {
      clearInterval(interval);
      countdownEl.style.display = "none";
      btn1.disabled = false;
      btn2.disabled = false;
      if(callback) callback();
    }
  },1000);
}

// Floating messages
function showFloatingMessage(msg, size = 30) {
  const fmsg = document.createElement('div');
  fmsg.className = 'floating-msg';
  fmsg.style.fontSize = size + 'px';
  fmsg.innerHTML = msg;
  document.body.appendChild(fmsg);
  setTimeout(() => fmsg.remove(), 3000);
}

// Hearts and sparks
function createHeart(x, y) {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.style.left = x + 'px';
  heart.style.top = y + 'px';
  heart.innerHTML = '❤️';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 2000);
}
function createSpark(x, y) {
  const spark = document.createElement('div');
  spark.className = 'spark';
  spark.style.left = x + 'px';
  spark.style.top = y + 'px';
  spark.innerHTML = '✨';
  document.body.appendChild(spark);
  setTimeout(() => spark.remove(), 1500);
}

// Confetti
function createConfetti() {
  for(let i=0;i<50;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*window.innerWidth + 'px';
    c.style.background = `hsl(${Math.random()*360},80%,60%)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

// Multi-touch / click
function addMultiTouchListener(button, callback) {
  button.addEventListener('click', callback);
  button.addEventListener('touchstart', (e) => { e.preventDefault(); callback(); }, {passive:false});
}

addMultiTouchListener(btn1, () => { if(raceActive) moveQueue1 += 5; });
addMultiTouchListener(btn2, () => { if(raceActive) moveQueue2 += 5; });

// Race loop
function startRace() {
  raceActive = true;
  function update() {
    if(!raceActive) return;

    if(moveQueue1 > 0) { pos1 += 1; moveQueue1 -= 1; car1.classList.add('moving'); createHeart(car1.offsetLeft+60, car1.offsetTop); createSpark(car1.offsetLeft+60, car1.offsetTop);}
    else car1.classList.remove('moving');

    if(moveQueue2 > 0) { pos2 += 1; moveQueue2 -= 1; car2.classList.add('moving'); createHeart(car2.offsetLeft+60, car2.offsetTop); createSpark(car2.offsetLeft+60, car2.offsetTop);}
    else car2.classList.remove('moving');

    if(pos1 > finish) pos1 = finish;
    if(pos2 > finish) pos2 = finish;

    car1.style.left = pos1 + '%';
    car2.style.left = pos2 + '%';

    // Random romantic messages
    if(Math.random()<0.01){
      const msgs = ['I love you Biwi ❤️','Rudraksh ❤️ Ishika','Dil to jit liya 😘','Hamesha saath hu 💖'];
      const msg = msgs[Math.floor(Math.random()*msgs.length)];
      showFloatingMessage(msg, 24 + Math.random()*8);
    }

    // Winner
    if(pos1 >= finish || pos2 >= finish){
      raceActive = false;
      createConfetti();
      if(pos1 >= finish){
        showFloatingMessage('Haa! Me jit gya 😎🚗💨 Agli bar tum jitna ❤️',28);
        btn1.disabled = true;
        btn2.disabled = true;
        setTimeout(() => {
          pos1 = 5; pos2 = 5;
          car1.style.left = pos1 + '%';
          car2.style.left = pos2 + '%';
          // restart automatically
          startCountdown(startRace);
        }, 2000);
      } else {
        showFloatingMessage('Madam ji, dil to jit laya ❤️ aur race bhi jit gaye! 😘',28);
        btn1.disabled = true;
        btn2.disabled = true;
        setTimeout(() => window.location.href='page2.html',1000);
      }
      return;
    }

    requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// Disable buttons until countdown
btn1.disabled = true;
btn2.disabled = true;

// Start countdown on load
window.addEventListener('load',()=>startCountdown(startRace));
</script>

</body>
</html>
