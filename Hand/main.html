<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forever Us 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.min.js"></script>

<style>
body{margin:0;overflow:hidden;background:black;font-family:Poppins,sans-serif}
#msg{
  position:absolute;top:5%;width:100%;text-align:center;
  font-size:2.2rem;color:#ff4f9a;text-shadow:0 0 25px #ff4f9a;z-index:5
}
video{
  position:fixed;right:12px;bottom:12px;width:140px;border-radius:12px;opacity:.85;z-index:5
}
</style>
</head>
<body>

<div id="msg">Make a Fist ✊</div>
<video id="video" autoplay playsinline></video>

<script>
// ================== PHOTOS ==================
const photos = ["1.jpeg",
  "2.jpeg",
  "3.jpeg",
  "4.jpeg"];
let currentPhoto = null;

// ================== THREE ==================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
camera.position.z = 520;

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

let geo, points, targets=[], scatter=[];
let blast=false, lastBlast=false;

// ================== LOAD + BUILD ==================
function loadRandomPhoto(){
  const img = new Image();
  const pick = photos[Math.floor(Math.random()*photos.length)];
  if(pick === currentPhoto && photos.length>1){
    return loadRandomPhoto();
  }
  currentPhoto = pick;
  img.src = pick;
  img.onload = ()=>buildParticles(img);
}

function buildParticles(image){
  // cleanup old
  if(points){
    scene.remove(points);
    geo.dispose();
    points.material.dispose();
    targets=[]; scatter=[];
  }

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");
  c.width=image.width; c.height=image.height;
  ctx.drawImage(image,0,0);

  const data=ctx.getImageData(0,0,c.width,c.height).data;
  const pos=[], col=[];

  for(let y=0;y<c.height;y+=4){
    for(let x=0;x<c.width;x+=4){
      const i=(y*c.width+x)*4;
      if(data[i+3]>150){
        const px=x-c.width/2;
        const py=-y+c.height/2;
        targets.push({x:px,y:py,z:0});
        scatter.push({
          x:(Math.random()-0.5)*1200,
          y:(Math.random()-0.5)*1200,
          z:(Math.random()-0.5)*1200
        });
        pos.push(px,py,0);
        col.push(data[i]/255,data[i+1]/255,data[i+2]/255);
      }
    }
  }

  geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute("color",new THREE.Float32BufferAttribute(col,3));

  points=new THREE.Points(
    geo,
    new THREE.PointsMaterial({size:3, vertexColors:true})
  );
  scene.add(points);
}

loadRandomPhoto(); // first photo

// ================== HAND ==================
const video=document.getElementById("video");
const msg=document.getElementById("msg");

const hands=new Hands({ locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}` });
hands.setOptions({
  maxNumHands:1, modelComplexity:1,
  minDetectionConfidence:0.7, minTrackingConfidence:0.7
});

function openHand(lm){
  let up=0;
  if(lm[8].y<lm[6].y) up++;
  if(lm[12].y<lm[10].y) up++;
  if(lm[16].y<lm[14].y) up++;
  if(lm[20].y<lm[18].y) up++;
  return up>=3;
}

hands.onResults(r=>{
  if(!r.multiHandLandmarks.length) return;
  blast = openHand(r.multiHandLandmarks[0]);
  msg.innerText = blast ? "Forever Us 💖" : "Make a Fist ✊";

  // 🔥 TRIGGER: when fist → open
  if(blast && !lastBlast){
    loadRandomPhoto(); // NEW RANDOM PHOTO PER BLAST
  }
  lastBlast = blast;
});

new Camera(video,{
  onFrame:async()=>await hands.send({image:video}),
  width:640,height:480
}).start();

// ================== ANIMATE ==================
function animate(){
  requestAnimationFrame(animate);
  if(!points) return;

  const p=geo.attributes.position.array;
  for(let i=0;i<targets.length;i++){
    const t=blast?scatter[i]:targets[i];
    p[i*3]   += (t.x-p[i*3]) * 0.06;
    p[i*3+1] += (t.y-p[i*3+1]) * 0.06;
    p[i*3+2] += (t.z-p[i*3+2]) * 0.06;
  }
  geo.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
}
animate();

window.onresize=()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
};
</script>

</body>
</html>
