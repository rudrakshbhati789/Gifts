<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biwii ❤️</title>

<style>
/* Reset */
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}

/* Fixed full-screen layout */
body, html{
  width:100%;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at center, #2b0035, #000);
  position:fixed;
  top:0;
  left:0;
}

/* Galaxy Stars */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://i.imgur.com/Z9oZQhC.png");
  opacity:0.3;
  animation:twinkle 10s infinite linear;
}
@keyframes twinkle{0%{opacity:.3}50%{opacity:.6}100%{opacity:.3}}

/* Chocolate Drip */
body::before{
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:120px;
  background:url('https://i.imgur.com/3q2hC5U.png');
  background-size:cover;
  filter:drop-shadow(0 0 15px hotpink);
  z-index:20;
  animation:drip 8s infinite alternate ease-in-out;
}
@keyframes drip{0%{height:120px}50%{height:130px}100%{height:120px}}

/* Heart Glow & Follow */
.heart{
  width:100px;
  position:absolute;
  top:20%;
  left:50%;
  transform:translate(-50%,-50%);
  animation:melt 5s infinite, glow 3s infinite alternate;
  filter:drop-shadow(0 0 25px #ff0080);
  z-index:25;
}
@keyframes melt{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes glow{0%{filter:drop-shadow(0 0 20px #ff0080)}100%{filter:drop-shadow(0 0 40px #ff66aa)}}

/* Center Text */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
  z-index:30;
  padding:0 10px;
  max-width:90%;
}
.center h1{
  font-size:32px;
  text-shadow:0 0 20px #ff00bb, 0 0 40px #ff66cc;
  animation:heartBeat 2s infinite;
}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* Typewriter Text */
#typeText{
  margin-top:10px;
  font-size:16px;
  opacity:0.9;
  width:100%;
  white-space:pre-line;
  min-height:60px;
  color: #ff66cc;
  text-shadow:0 0 12px #ff33aa;
}

/* Button */
.btn{
  margin-top:20px;
  padding:10px 20px;
  background:#ff0077;
  border-radius:50px;
  color:white;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 25px #ff33aa;
  transition:.3s;
}
.btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 35px #ff66cc;
}

/* Surprise Panel */
#surprise{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  backdrop-filter:blur(6px);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}

/* Close Button */
#closeBtn{
  position:absolute;
  top:15px;
  right:15px;
  background:#ff33aa;
  color:white;
  padding:8px 18px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #ff66cc;
  transition:.3s;
}
#closeBtn:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #ff99dd;
}

/* Photo Frame */
.frame{
  width:150px;height:180px;
  border:4px solid gold;
  border-radius:18px;
  overflow:hidden;
  margin:10px;
  animation:pop .8s ease forwards;
  box-shadow:0 0 25px gold;
}
.frame img{
  width:100%;height:100%;object-fit:cover;
}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

/* Planets Orbiting */
.planet{
  width:12px;height:12px;
  background:#ff2ecc;
  border-radius:50%;
  position:absolute;
  left:50%;top:50%;
  transform-origin:-100px;
  animation:orbit 12s linear infinite;
  box-shadow:0 0 20px #ff00dd;
}
.planet:nth-child(2){animation-duration:18s; background:#ffcc00; transform-origin:-140px;}
.planet:nth-child(3){animation-duration:24s; background:#00ccff; transform-origin:-180px;}
@keyframes orbit{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* Kiss Burst */
.kiss{position:absolute;font-size:20px;animation:burst 1s forwards;}
@keyframes burst{0%{transform:scale(0)}70%{transform:scale(1.8)}100%{transform:scale(0);opacity:0}}

/* Kiss Rain */
.rain{position:absolute;top:-50px;font-size:18px;animation:fall linear infinite;}
@keyframes fall{0%{transform:translateY(0)}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}

/* Heart Cursor Trail */
.cursorHeart{position:fixed;color:#ff33aa;pointer-events:none;animation:fade .9s ease-out forwards, scaleHeart .9s forwards;}
@keyframes fade{to{transform:translateY(-15px);opacity:0}}
@keyframes scaleHeart{0%{transform:scale(0.5)}50%{transform:scale(1)}100%{transform:scale(1.2)}}

/* Rose Petals */
.petal{position:fixed;top:-20px;font-size:16px;animation:petalFall linear infinite;}
@keyframes petalFall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}

/* Floating Love Particles */
.loveParticle{position:fixed;pointer-events:none;font-weight:bold;opacity:0.8;animation:floatUp 3s ease-out forwards;text-shadow:0 0 8px #ff55aa, 0 0 15px #ff33cc;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:0.8;}100%{transform:translateY(-80px) scale(1.3);opacity:0;}}

/* Responsive */
@media(max-width:500px){
  .center h1{font-size:26px;}
  #typeText{font-size:14px;min-height:50px;}
  .frame{width:120px;height:150px;}
  .btn{padding:8px 15px;font-size:14px;}
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7f52e4e974.mp3" type="audio/mp3">
</audio>

<img src="/new gift/heart.png" class="heart">

<!-- Planets -->
<div class="planet"></div>
<div class="planet"></div>
<div class="planet"></div>

<div class="center">
  <h1>❤️ Biwii ❤️</h1>
  <p id="typeText"></p>
  <div class="btn" onclick="showSurprise()">Tap for Surprise 💫</div>
</div>

<div id="surprise">
  <div id="closeBtn" onclick="hideSurprise()">Close ✖</div>
  <h2 style="color:white;margin-bottom:20px;text-shadow:0 0 20px hotpink;">
    Our Beautiful Moments ❤️
  </h2>
  <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">
    <div class="frame"><img src="/gg/photos/9.jpeg"></div>
    <div class="frame"><img src="/your-project/me.jpeg"></div>
  </div>
</div>

<script>
// Typewriter
let text = "Meri jaan Biwii…\nTum meri duniya ka sabse khoobsurat hissa ho.\nTumhare bina sab adhoora sa lagta hai.\nI love you… forever ❤️";
let index = 0;
function type(){if(index<text.length){document.getElementById("typeText").innerHTML+=text.charAt(index);index++;setTimeout(type,40);}}type();

// Show/Hide Surprise
function showSurprise(){document.getElementById("surprise").style.display="flex";}
function hideSurprise(){document.getElementById("surprise").style.display="none";}

// Kiss Burst
document.addEventListener("click",(e)=>{
  let k=document.createElement("div");
  k.className="kiss";
  k.style.left=e.pageX+"px";
  k.style.top=e.pageY+"px";
  k.innerHTML="💋";
  document.body.appendChild(k);
  setTimeout(()=>k.remove(),900);
});

// Kiss Rain
setInterval(()=>{
  let r=document.createElement("div");
  r.className="rain";
  r.innerHTML="💋";
  r.style.left=Math.random()*innerWidth+"px";
  r.style.animationDuration=(5+Math.random()*3)+"s";
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),7000);
},400);

// Heart Trail + Love Particles
document.addEventListener("mousemove",(e)=>{
  let h=document.createElement("div");
  h.className="cursorHeart";
  h.style.left=e.pageX+"px";
  h.style.top=e.pageY+"px";
  h.innerHTML="❤️";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),800);

  let particle=document.createElement("div");
  particle.className="loveParticle";
  particle.innerHTML="I ❤️ You";
  particle.style.left=e.pageX+(Math.random()*20-10)+"px";
  particle.style.top=e.pageY+(Math.random()*20-10)+"px";
  particle.style.fontSize=14+Math.random()*6+"px";
  particle.style.color=`hsl(${Math.random()*360},100%,70%)`;
  document.body.appendChild(particle);
  setTimeout(()=>particle.remove(),3000);
});

// Rose Petals
setInterval(()=>{
  let p=document.createElement("div");
  p.className="petal";
  p.innerHTML="🌹";
  p.style.left=Math.random()*innerWidth+"px";
  p.style.animationDuration=(6+Math.random()*4)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),9000);
},500);

// Heart follow cursor (smooth)
let heartFollow=document.querySelector(".heart");
let mouseX=window.innerWidth/2;
let mouseY=window.innerHeight/4;
let heartX=mouseX;
let heartY=mouseY;
document.addEventListener("mousemove",(e)=>{mouseX=e.pageX; mouseY=e.pageY-50;});
function animateHeart(){
  heartX+=(mouseX-heartX)*0.05;
  heartY+=(mouseY-heartY)*0.05;
  heartFollow.style.left=heartX+"px";
  heartFollow.style.top=heartY+"px";
  requestAnimationFrame(animateHeart);
}
animateHeart();
</script>

</body>
</html>
