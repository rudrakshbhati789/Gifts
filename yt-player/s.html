<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start Page</title>

<style>
    body{
        margin:0;
        background: linear-gradient(135deg, #ffd6e8, #ffb6d9, #ffc8e2);
        overflow:hidden;
        height: 100vh;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        text-align:center;
        position:relative;
        font-family: "Poppins", sans-serif;
    }

    /* ✨ Top & Bottom Glow */
    body::before, body::after{
        content:"";
        position:absolute;
        left:0;
        width:100%;
        height:150px;
        z-index:0;
        pointer-events:none;
    }
    body::before{
        top:0;
        background:linear-gradient(to bottom, rgba(255,255,255,0.6), transparent);
    }
    body::after{
        bottom:0;
        background:linear-gradient(to top, rgba(255,255,255,0.6), transparent);
    }

    /* ❤️ Typewriter Text */
    h1{
        font-size: 2.3rem;
        color: #b60055;
        text-shadow: 
            0 0 12px rgba(255,255,255,0.9),
            0 0 25px rgba(255,60,140,0.7),
            0 0 10px rgba(255,0,100,0.5);
        white-space: nowrap;
        overflow: hidden;
        border-right: 3px solid #ff0066;
        width: 0;
        animation: typing 4s steps(40) forwards, blink 0.7s infinite;
        z-index:3;
    }

    @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
    }

    @keyframes blink {
        0% { border-color: transparent; }
        50% { border-color: #ff0066; }
        100% { border-color: transparent; }
    }

    /* Fog */
    .fog{
        position:absolute;
        width:330px;
        height:330px;
        background: radial-gradient(circle, rgba(255,170,200,0.55), rgba(255,170,200,0));
        filter: blur(70px);
        border-radius:50%;
        animation: fogMove 14s ease-in-out infinite alternate;
        z-index:1;
    }

    .fog:nth-child(1){ top:10%; left:8%; animation-duration:15s; }
    .fog:nth-child(2){ top:60%; left:20%; animation-duration:17s; }
    .fog:nth-child(3){ top:30%; left:70%; animation-duration:19s; }
    .fog:nth-child(4){ top:75%; left:55%; animation-duration:21s; }

    @keyframes fogMove {
        from{ transform: translate(-40px,-40px) scale(1); }
        to  { transform: translate(40px,40px) scale(1.3); }
    }

    /* Falling hearts */
    .heart{
        position:absolute;
        color:#ff0066;
        font-size:25px;
        animation: fall 5s linear infinite;
        opacity:0.85;
        z-index:2;
    }

    @keyframes fall {
        0% { transform: translateY(-120px) rotate(0deg); opacity:1; }
        100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
    }

    /* Sparkles */
    .sparkle{
        position:absolute;
        width:6px;
        height:6px;
        background:white;
        border-radius:50%;
        box-shadow:0 0 10px white;
        opacity:0.8;
        animation: sparkleMove 4s linear infinite;
    }
    @keyframes sparkleMove {
        from { transform: translateY(-20vh) scale(1); opacity:1; }
        to   { transform: translateY(120vh) scale(0.3); opacity:0; }
    }

    /* Button */
    .btn{
        margin-top:25px;
        padding: 14px 30px;
        background: rgba(255,255,255,0.3);
        backdrop-filter: blur(8px);
        color:#b60055;
        font-size:1.25rem;
        text-decoration:none;
        border-radius:35px;
        box-shadow:0 0 20px rgba(255,100,160,0.6);
        border:2px solid rgba(255,255,255,0.4);
        transition:0.3s ease;
        z-index:3;
    }

    .btn:hover{
        transform:scale(1.1);
        background: rgba(255,255,255,0.5);
        box-shadow:0 0 25px rgba(255,0,120,1);
    }

</style>
</head>
<body>

<!-- Fog -->
<div class="fog"></div>
<div class="fog"></div>
<div class="fog"></div>
<div class="fog"></div>

<!-- Typewriter Title -->
<h1>I Love You Mere Pyare Biwi 🥰🫀</h1>

<!-- Button -->
<a href="/yt-player/index.html" class="btn">Idhar click kro mere jaan 😘</a>

<!-- Hearts + Sparkles -->
<script>
    function createHeart(){
        let heart=document.createElement("div");
        heart.classList.add("heart");
        heart.textContent="❤️";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(20+Math.random()*20)+"px";
        heart.style.animationDuration=(3+Math.random()*3)+"s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    }

    function createSparkle(){
        let s=document.createElement("div");
        s.classList.add("sparkle");
        s.style.left=Math.random()*100+"vw";
        s.style.animationDuration=(3+Math.random()*3)+"s";
        s.style.opacity=0.7+Math.random()*0.3;
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),5000);
    }

    setInterval(createHeart,280);
    setInterval(createSparkle,400);
</script>

</body>
</html>
