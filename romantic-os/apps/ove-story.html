<style>
body{
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  margin:0;
  font-family:"Poppins",sans-serif;
  overflow:hidden;
}

/* CHAPTER LIST */
.chapter-list{
  padding:70px 16px 20px;
  display:flex;
  flex-direction:column;
  gap:14px;
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.chapter{
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(12px);
  padding:18px;
  border-radius:18px;
  color:white;
  font-size:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  user-select:none;
}

/* STORY PAGE */
.story-page{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  z-index:999;
}

/* STATUS BAR */
.status-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,0.15);
  color:white;
  font-weight:500;
  font-size:16px;
}

/* STORY CONTENT */
.story-content{
  flex:1;
  padding:20px;
  text-align:center;
  color:white;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.story-content p{
  font-size:20px;
  line-height:1.8;
  white-space:pre-line;
  margin:0 0 20px;
}

/* CONTROLS */
.controls{

  justify-content:space-around;
  padding:10px;
  background:rgba(255,255,255,0.15);
  flex-shrink:0;
}

.ctrl-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.25);
  color:white;
  font-size:22px;

/* EDITOR */
textarea{

  height:55%;

  border-radius:15px;
  border:none;
  font-size:18px;
  outline:none;
  resize:none;
}

.save-btn{

  padding:12px 28px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:white;
  font-size:16px;
}

/* MOBILE RESPONSIVE */
@media (max-width:480px){
  .chapter{font-size:16px;padding:14px;}
  .ctrl-btn{width:42px;height:42px;font-size:18px;}
  .story-content p{font-size:18px;}

}

let current=0;
const list=document.getElementById("chapterList");
const page=document.getElementById("storyPage");
const titleEl=document.getElementById("chapterTitle");
const textEl=document.getElementById("storyText");

/* LOAD CHAPTERS */
chapters.forEach((c,i)=>{
 let div=document.createElement("div");
 div.className="chapter";
 div.innerHTML=`<span>${c.title}</span><span>➡</span>`;
 div.addEventListener('touchend', e => { openStory(i); e.stopPropagation(); }, {passive:true});
 div.addEventListener('click', ()=>openStory(i));
 list.appendChild(div);
});

function openStory(i){
 current=i;
 page.style.display="flex";
 show();
}

function closeStory(){ page.style.display="none"; }

function show(){
 titleEl.innerText = chapters[current].title;

  if(chapters[current].editable){
    let saved = localStorage.getItem("chapter6") || "";
    textEl.innerHTML = `
      <textarea id="editor" placeholder="Yahan apne dil ki baat likho… ❤️">${saved}</textarea>
      <button class="save-btn" onclick="saveChapter()">💾 Save</button>
    `;
  } else {
    textEl.innerHTML = `<p>${chapters[current].text}</p>`;
  }
}

function next(){ if(current<chapters.length-1){current++;show();} }
function prev(){ if(current>0){current--;show();} }
function speak(){ let u=new SpeechSynthesisUtterance(chapters[current].text); u.lang="hi-IN"; speechSynthesis.speak(u); }

/* SWIPE */
let sx=0;
page.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
page.addEventListener("touchend",e=>{
 let dx=sx-e.changedTouches[0].clientX;
 if(dx>60) next();
 if(dx<-60) prev();
});

/* HEART EFFECT */
document.addEventListener("touchstart",e=>{
 if(e.target.closest("button"))return;
 let h=document.createElement("div");
 h.innerText="❤️";
 h.style.position="fixed";
 h.style.left=e.touches[0].clientX+"px";
 h.style.top=e.touches[0].clientY+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),600);
});

function saveChapter(){
  let text = document.getElementById("editor").value;
  localStorage.setItem("chapter6", text);
  alert("❤️ Chapter save ho gaya");
}
