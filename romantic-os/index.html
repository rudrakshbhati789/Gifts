<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Love OS Lock Screen 🔒</title>
<link rel="stylesheet" href="/romantic-os/css/style.css">
<script src="jss/os.js" defer></script>
</head>
<body id="lockScreen">

<div class="lock-screen glass">
  <h1>Love OS 💖</h1>
  <p>Swipe up to unlock</p>
</div>

<script>
let startY;
document.addEventListener("touchstart", e=>startY=e.touches[0].clientY);
document.addEventListener("touchend", e=>{
  if(startY - e.changedTouches[0].clientY > 80){
    location.href="home.html";
  }
});
</script>

</body>
</html>
