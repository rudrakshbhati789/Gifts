<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meri Madam Ji Ki Gallery</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Poppins", sans-serif;
        background: #ffeef8;
        padding: 20px;
        text-align: center;
    }

    .page-title {
        font-size: 2.5rem;
        margin-bottom: 20px;
        color: #d63384;
        font-weight: 700;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        justify-content: center;
        padding: 10px;
    }

    .gallery-item {
        background: white;
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .gallery-item:hover {
        transform: scale(1.05);
    }

    .gallery-item img {
        width: 100%;
        height: auto;
        border-radius: 10px;
    }

    .desc {
        margin-top: 10px;
        font-size: 1rem;
        font-weight: 500;
        color: #444;
    }

    /* 🔥 Responsive Text Adjustments */
    @media (max-width: 768px) {
        .page-title {
            font-size: 2rem;
        }
        .desc{
            font-size: 0.9rem;
        }
    }

    @media (max-width: 480px) {
        body{
            padding: 10px;
        }
        .page-title {
            font-size: 1.6rem;
        }
        .gallery {
            grid-template-columns: 1fr;
        }
        .desc {
            font-size: 0.85rem;
        }
    }
</style>
</head>
<body>
    <div class="color-overlay"></div>
    <h1 class="main-heading">✨ Meri Madam Ji Ki Khoobsurat Gallery ✨</h1>
    <div class="stars"></div>

    <div class="gallery-container">
        <div class="gallery"></div>
    </div>

    <div class="pookie-btn-container">
        <button class="pookie-btn">🌸 Meri Pookie 🌸</button>
    </div>

    <div class="pookie-modal">
        <div class="pookie-message-container">
            <div class="pookie-close">×</div>
            <div class="pookie-message"></div>
        </div>
    </div>

    <script>
        const messages = [
            "Meri Queen, meri jaan! 👑💖",
            "Tumhari smile mera din bana deti hai ✨",
            "Hamesha tumhari taraf, meri jaan 💝",
            "Tum meri sapno ki raani ho 🌙",
            "Dil sirf tumhare liye dhadakta hai 💓",
            "Meri pyari Madam Ji 🌹",
            "Hum dono ekdum perfect match hain 💑",
            "Love you chaand tak aur wapas 🌟",
            "Meri duniya tumse hi chalti hai 🌍",
            "Tum ho meri heartbeat 💗"
        ];

        const images = ["pic1.jpg","pic2.jpg","pic3.jpg","pic4.jpg","pic5.jpg","pic6.jpg","pic7.jpg","pic8.jpg","pic9.jpg","pic4.jpg"];

        const gallery = document.querySelector('.gallery');

        function createCard(i) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-number">💝</div>
                <div class="card-image"><img src="${images[i]}" /></div>
                <div class="card-message">${messages[i]}</div>
                <button class="like-btn">💖 Pyaar</button>
            `;
            return card;
        }

        for (let i = 0; i < 10; i++) gallery.appendChild(createCard(i));
        for (let i = 0; i < 10; i++) gallery.appendChild(createCard(i));

        const pookieModal = document.querySelector('.pookie-modal');
        const pookieMsg = document.querySelector('.pookie-message');
        const pookieBtn = document.querySelector('.pookie-btn');
        const pookieClose = document.querySelector('.pookie-close');

        const pookieMessages = [
            "Tum meri favourite attention ho, meri jaan. Tumhari hasi, tumhari baatein, sab kuch dil ko khush kar deta hai. Tum ho meri life ki sabse pyari feeling. 🌈✨🥰",
            "Jab tum mere saath hoti ho na, lagta hai duniya perfect hai. Tum ho meri khushi ka asli reason. 💖✨",
            "Sach bolu, tumhare bina sab adhura lagta hai. Tum ho meri heartbeat aur meri peace. 🫶💗",
            "Tumhari ek smile mera pura din bright kar deti hai. Tum ho meri pookie, meri jaan, meri sab kuch. 💕🥺",
            "Jitna pyaar main tumse karta hoon, utna shayad words me kabhi nahi bata paunga. Tum hi ho meri life ka cutest part. 💞✨"
        ];

        pookieBtn.addEventListener('click', () => {
            const msg = pookieMessages[Math.floor(Math.random() * pookieMessages.length)];
            pookieMsg.innerHTML = msg;
            pookieModal.classList.add('active');
        });

        pookieClose.addEventListener('click', () => pookieModal.classList.remove('active'));
        pookieModal.addEventListener('click', e => { if (e.target === pookieModal) pookieModal.classList.remove('active'); });
    </script>
</body>
</html>
