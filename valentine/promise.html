<!DOCTYPE html><html><head><title>Promise Day</title><link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:black;overflow:hidden;font-family:cursive;color:hotpink}
.center{position:absolute;top:45%;left:50%;font-size:120px;transform:translate(-50%,-50%);animation:float 4s infinite;filter:drop-shadow(0 0 30px hotpink)}
.bg span{position:absolute;font-size:40px;animation:floatBg 6s infinite}
.frame{position:absolute;box-shadow:0 0 20px hotpink;padding:5px;border-radius:15px}
.frame img{width:80px;height:110px;border-radius:12px}
.text{position:absolute;top:65%;width:100%;text-align:center;font-size:18px;text-shadow:0 0 10px hotpink}
.btn{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:black;color:hotpink;padding:12px 30px;border:none;border-radius:25px;box-shadow:0 0 20px hotpink}
@keyframes float{50%{transform:translate(-50%,-55%)}}@keyframes floatBg{50%{transform:translateY(-60px)}}
</style></head><body>
<div class="bg"><span style="top:10%;left:10%">🤞</span><span style="bottom:20%;right:20%">🤍</span></div>
<div class="frame" style="top:10%;left:10%"><img src="/imagesgift/images/12.jpeg"></div>
<div class="frame" style="top:15%;right:10%"><img src="/imagesgift/images/15.jpeg"></div>
<div class="frame" style="bottom:20%;left:15%"><img src="/imagesgift/images/7.jpeg"></div>
<div class="frame" style="bottom:25%;right:15%"><img src="/imagesgift/images/2.jpeg"></div>
<div class="center">🤞</div>
<div class="text" id="text"></div>
<button class="btn" onclick="location.href='hug.html'">Hug Day ➜</button>
<script>const msg="Waada hai har khushi aur gham me tumhara saath dunga 🤞";let i=0;(function type(){if(i<msg.length){text.innerHTML+=msg[i++];setTimeout(type,70)}})();</script>
</body></html>
