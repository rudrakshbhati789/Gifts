<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meri Madam Ji Ki Gallery (Responsive)</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background: linear-gradient(45deg, #ff69b4, #da70d6, #9370db, #ff1493);
    background-size: 400% 400%;
    animation: gradientAnim 15s ease infinite;
    font-family: 'Poppins', sans-serif;
    padding: 20px;
    overflow-x: hidden;
}

@keyframes gradientAnim {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.main-heading {
    font-size: 42px;
    text-align: center;
    margin-bottom: 30px;
    font-weight: 700;
    background: linear-gradient(90deg, #ffd700, #ff8c00, #ff4500);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* ⭐ Scrollable gallery */
.gallery-container {
    width: 100%;
    overflow: hidden;
}

.gallery {
    display: flex;
    gap: 20px;
    width: max-content;
    animation: scroll 25s linear infinite;
    padding: 10px;
}

.gallery:hover {
    animation-play-state: paused;
}

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* ⭐ Card */
.card {
    width: 240px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 15px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.card-image img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    border-radius: 15px;
}

.card-message {
    margin-top: 10px;
    color: #fff;
    font-size: 16px;
}

.like-btn {
    margin-top: 10px;
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(255,105,180,0.4);
    border: 2px solid white;
    color: white;
    cursor: pointer;
}

/* 🌸 Pookie Button */
.pookie-btn-container {
    text-align: center;
    margin-top: 30px;
}

.pookie-btn {
    padding: 15px 30px;
    background: linear-gradient(135deg, #f9c4ff, #ff9cee);
    border-radius: 30px;
    border: 3px solid #fff;
    font-size: 20px;
    cursor: pointer;
}

/* Modal */
.pookie-modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
}

.pookie-modal.active {
    opacity: 1;
    pointer-events: all;
}

.pookie-message-container {
    width: 90%; max-width: 450px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    border: 2px solid #fff;
}

.pookie-message {
    font-size: 20px;
    color: white;
}

/* ❤️ Floating Hearts */
.heart {
    position: absolute;
    font-size: 22px;
    animation: floatUp 2s linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.8); opacity: 0; }
}

/* 📱 RESPONSIVE MEDIA QUERIES */

@media (max-width: 768px) {
    .main-heading { font-size: 32px; }
    .card { width: 200px; }
    .card-image img { height: 190px; }
    .gallery { gap: 15px; animation-duration: 35s; }
}

@media (max-width: 480px) {
    .main-heading { font-size: 26px; }
    .card { width: 170px; padding: 10px; }
    .card-image img { height: 160px; }
    .card-message { font-size: 14px; }
    .gallery { gap: 12px; animation-duration: 45s; }
    .pookie-btn { font-size: 16px; padding: 10px 20px; }
}
</style>
</head>

<body>
<audio id="bgMusic" autoplay loop></audio>

<button id="changeMusicBtn" 
style="padding:10px 20px;background:#ff9cee;border:none;border-radius:10px;margin:20px;font-size:16px;cursor:pointer;">
🔁 Change Music
</button>

<h1 class="main-heading">✨ Meri Madam Ji Ki Khoobsurat Gallery ✨</h1>

<div class="gallery-container">
    <div class="gallery" id="gallery"></div>
</div>

<div class="pookie-btn-container">
    <button class="pookie-btn">🌸 Meri Pookie 🌸</button>
</div>

<div class="pookie-modal" id="modal">
    <div class="pookie-message-container">
        <p class="pookie-message" id="pookieMsg"></p>
    </div>
</div>

<script>
const messages = [
"Meri Queen, meri jaan! 👑💖",
"Tumhari smile mera din bana deti hai ✨",
"Hamesha tumhari taraf, meri jaan 💝",
"Tum meri sapno ki raani ho 🌙",
"Dil sirf tumhare liye dhadakta hai 💓",
"Tumhari muskaan meri zindagi hai biwi 😘",
"Jab tum paas hoti ho, dil halka sa nasha karta hai 💖",
"Love you beyond the stars my Jaan ✨",
"Tum bin sab adhoora sa lagta hai ❤️",
"Tum hi meri pehli, aakhri, aur hamesha waali ho 💞",
];

const images = ["/gg/photos/1.jpeg","/gg/photos/2.jpeg","/gg/photos/3.jpeg","/gg/photos/4.jpeg","/gg/photos/5.jpeg","/gg/photos/6.jpeg","/gg/photos/7.jpeg","/gg/photos/8.jpeg","/gg/photos/9.jpeg","/gg/photos/10.jpeg"];

const gallery = document.getElementById('gallery');

for(let i=0; i<images.length; i++){
    gallery.innerHTML += `
    <div class='card'>
        <div class='card-image'><img src='${images[i]}'></div>
        <div class='card-message'>${messages[i]}</div>
        <button class='like-btn'>💖 Pyaar</button>
    </div>`;
}

/* ❤️ Floating Hearts Effect */
document.addEventListener("click", function(e){
    if(e.target.classList.contains("like-btn")){
        createHeart(e.target);
    }
});
// 🎵 All your music files
const musicList = [
    "/audio/1.mp3",
    "/audio/2.mp3",
    "/audio/3.mp3",
    "/audio/4.mp3",
    "/audio/bg.mp3"
];

const bgMusic = document.getElementById("bgMusic");
let lastIndex = -1;

// 🎵 Random but NOT repeating
function playRandomSong() {
    let newIndex;

    do {
        newIndex = Math.floor(Math.random() * musicList.length);
    } while (newIndex === lastIndex);

    lastIndex = newIndex;

    bgMusic.src = musicList[newIndex];
    bgMusic.play();
}

// Auto play on first user click (mobile fix)
document.addEventListener("click", () => {
    if (bgMusic.paused) playRandomSong();
}, { once: true });

// Change music button
document.getElementById("changeMusicBtn").addEventListener("click", () => {
    playRandomSong();
});

function createHeart(button){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";

    const rect = button.getBoundingClientRect();
    heart.style.left = rect.left + rect.width/2 + "px";
    heart.style.top = rect.top - 10 + "px";

    document.body.appendChild(heart);

    setTimeout(()=> heart.remove(), 2000);
}

/* 🌸 Pookie Modal Logic */
const modal = document.getElementById('modal');
const msgBox = document.getElementById('pookieMsg');

document.querySelector('.pookie-btn').addEventListener('click', ()=>{
    msgBox.innerText = messages[Math.floor(Math.random()*messages.length)];
    modal.classList.add('active');
});

modal.addEventListener('click', ()=> modal.classList.remove('active'));
</script>

</body>
</html>
