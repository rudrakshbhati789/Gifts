<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rudraksh ❤️ Ishika Car Race</title>
<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(to right, #ff9ecb, #ff5fa2, #ff2e63);
  font-family: 'Poppins', sans-serif;
}

.game-wrapper {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.road {
  width: 90%;
  height: 60%;
  position: relative;
  background: #222; 
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(255,255,255,0.4);
}

.finish-line {
  width: 10px;
  height: 100%;
  background: repeating-linear-gradient(
    white 0 10px,
    transparent 10px 20px
  );
  position: absolute;
  right: 0;
  top: 0;
  border-left: 2px solid #fff;
}

.car {
  width: 120px;
  position: absolute;
}

#car1 { top: 25%; left: 5%; }
#car2 { top: 60%; left: 5%; }

.controls {
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 20px;
  position: fixed; /* fixed for mobile visibility */
  bottom: 10px;
  left: 0;
  padding: 0 10px;
  z-index: 50;
}

.control-btn {
  flex: 1;
  max-width: 45%;
  min-width: 120px;
  background: #ffffff;
  border: none;
  padding: 15px 0;
  border-radius: 15px;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 0 10px rgba(255,255,255,0.6);
  cursor: pointer;
  color: #ff2e63;
  text-align: center;
  touch-action: manipulation; /* mobile touch improvement */
}

.floating-msg {
  position: absolute;
  top: 40%;
  width: 100%;
  text-align: center;
  font-size: 30px;
  color: #ffeb3b;
  text-shadow: 0 0 15px #f00;
  opacity: 0;
  animation: floatMsg 3s forwards;
  z-index: 30;
}

@keyframes floatMsg {
  0% { opacity: 0; transform: translateY(0); }
  10% { opacity: 1; }
  90% { opacity: 1; transform: translateY(-50px); }
  100% { opacity: 0; transform: translateY(-100px); }
}

.heart {
  position: absolute;
  font-size: 24px;
  color: #ff2e63;
  animation: floatHeart 2s linear forwards;
}

@keyframes floatHeart {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
}

#countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 80px;
  color: #ffeb3b;
  font-weight: bold;
  text-shadow: 0 0 20px #f00, 0 0 30px #ff2e63;
  z-index: 50;
}
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="road">
    <div class="finish-line"></div>
  </div>

  <img src="/images/car.gif" id="car1" class="car" />
  <img src="/images/car 2.gif" id="car2" class="car" />

  <div class="controls">
    <button id="btnCar1" class="control-btn">Rudraksh 🚗💨</button>
    <button id="btnCar2" class="control-btn">Ishika 💖🚗</button>
  </div>

  <div id="countdown"></div>
</div>

<script>
const car1 = document.getElementById('car1');
const car2 = document.getElementById('car2');
const btn1 = document.getElementById('btnCar1');
const btn2 = document.getElementById('btnCar2');

let pos1 = 5;
let pos2 = 5;
const finish = 80;
let moveQueue1 = 0;
let moveQueue2 = 0;
let raceActive = false;

// Floating messages
function showFloatingMessage(msg, size = 30) {
  const fmsg = document.createElement('div');
  fmsg.className = 'floating-msg';
  fmsg.style.fontSize = size + 'px';
  fmsg.innerHTML = msg;
  document.body.appendChild(fmsg);
  setTimeout(() => fmsg.remove(), 3000);
}

// Heart effect
function createHeart(x, y) {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.style.left = x + 'px';
  heart.style.top = y + 'px';
  heart.innerHTML = '❤️';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 2000);
}

// Countdown
function startCountdown(callback) {
  const countdownEl = document.getElementById('countdown');
  let count = 3;
  countdownEl.innerText = count;
  countdownEl.style.display = "block";

  const interval = setInterval(() => {
    count--;
    if(count > 0) countdownEl.innerText = count;
    else if(count === 0) countdownEl.innerText = "GO! 🏁";
    else {
      clearInterval(interval);
      countdownEl.style.display = "none";
      btn1.disabled = false;
      btn2.disabled = false;
      if(callback) callback();
    }
  },1000);
}

// Multi-touch / click support
function addMultiTouchListener(button, callback) {
  button.addEventListener('click', callback);
  button.addEventListener('touchstart', (e) => {
    e.preventDefault();
    callback();
  }, {passive: false});
}

// Queue moves
addMultiTouchListener(btn1, () => { if(raceActive) moveQueue1 += 5; });
addMultiTouchListener(btn2, () => { if(raceActive) moveQueue2 += 5; });

// Start race loop
function startRace() {
  raceActive = true;
  function update() {
    if(!raceActive) return;

    if(moveQueue1 > 0) { pos1 += 1; moveQueue1 -= 1; }
    if(moveQueue2 > 0) { pos2 += 1; moveQueue2 -= 1; }

    if(pos1 > finish) pos1 = finish;
    if(pos2 > finish) pos2 = finish;

    car1.style.left = pos1 + '%';
    car2.style.left = pos2 + '%';

    // Hearts when moving
    if(moveQueue1 > 0) createHeart(car1.offsetLeft + 60, car1.offsetTop);
    if(moveQueue2 > 0) createHeart(car2.offsetLeft + 60, car2.offsetTop);

    // Check winner
    if(pos1 >= finish || pos2 >= finish){
      raceActive = false;
      if(pos1 >= finish){
        showFloatingMessage('Haa! Me jit gya 😎🚗💨 Agli bar tum jitna ❤️',28);
        setTimeout(() => {
          pos1 = 5; pos2 = 5;
          car1.style.left = pos1 + '%';
          car2.style.left = pos2 + '%';
          btn1.disabled = false;
          btn2.disabled = false;
        }, 2000);
      } else {
        showFloatingMessage('Madam ji, dil to jit laya ❤️ aur race bhi jit gaye! 😘',28);
        setTimeout(() => window.location.href = 'page2.html', 1000);
      }
      return;
    }

    requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// Disable buttons until countdown
btn1.disabled = true;
btn2.disabled = true;

// Start countdown and then race
window.addEventListener('load', () => {
  startCountdown(startRace);
});
</script>

</body>
</html>
