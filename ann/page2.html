<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Special Gift ❤️ Biwi</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
  margin:0;
  padding:0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to bottom, #ff9ecb, #ff5fa2, #ff2e63);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.wrapper {
  position: relative;
  width: 90%;
  max-width: 400px;
  text-align:center;
}

#giftBox {
  width:150px;
  height:150px;
  margin:0 auto;
  background: #fff;
  border-radius:20px;
  position:relative;
  cursor:pointer;
  transition: transform 1s;
  box-shadow: 0 0 30px rgba(255,255,255,0.6);
}

#giftBox.open {
  transform: translateY(-50px) scale(1.1) rotate(-5deg);
}

.lid {
  width:150px;
  height:50px;
  background: #ff2e63;
  border-radius: 20px 20px 0 0;
  position:absolute;
  top:0;
  left:0;
  transform-origin: top center;
  transition: transform 1s;
}

#giftBox.open .lid {
  transform: rotateX(-120deg);
}

.heart, .spark {
  position:absolute;
  font-size:24px;
  animation: floatUp 3s linear forwards;
}

.heart { color:#ffeb3b; }
.spark { color:#fff; }

@keyframes floatUp {
  0% { opacity:1; transform: translateY(0) scale(1);}
  100% { opacity:0; transform: translateY(-150px) scale(1.5);}
}

.message {
  font-size:20px;
  color:#fff;
  text-shadow: 0 0 10px #ff2e63;
  margin-top:20px;
  opacity:0;
  transition: opacity 0.5s;
}
</style>
</head>
<body>

<div class="wrapper">
  <div id="giftBox">
    <div class="lid"></div>
  </div>
  <div id="messages"></div>
</div>

<script>
const giftBox = document.getElementById('giftBox');
const messagesDiv = document.getElementById('messages');

const messages = [
  "Rudraksh ❤️ Biwi",
  "Me hamesha tumhare saath hu mere payre Biwi ❤️",
  "Tum meri zindagi ki sabse pyari cheez ho 😘",
  "Dil se I love you 💖"
];

function showMessage(i){
  if(i >= messages.length) return;
  const msg = document.createElement('div');
  msg.className = 'message';
  msg.innerText = messages[i];
  messagesDiv.appendChild(msg);
  setTimeout(()=> msg.style.opacity = 1, 100);
  setTimeout(()=> showMessage(i+1), 2000); // 2 sec delay
}

// Floating hearts
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.style.left = Math.random()*100 + '%';
  heart.style.top = '100%';
  heart.innerHTML = '❤️';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 3000);
}

// Sparks
function createSpark() {
  const spark = document.createElement('div');
  spark.className = 'spark';
  spark.style.left = Math.random()*100 + '%';
  spark.style.top = '100%';
  spark.innerHTML = '✨';
  document.body.appendChild(spark);
  setTimeout(()=> spark.remove(), 3000);
}

// Create random hearts and sparks
setInterval(() => {
  createHeart();
  createSpark();
}, 500);

giftBox.addEventListener('click', ()=>{
  giftBox.classList.add('open');
  showMessage(0);
});
</script>

</body>
</html>
