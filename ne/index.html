<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forever Us ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff4f9a;
  --soft:#ffd6e8;
  --dark:#120015;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,system-ui;
  background:radial-gradient(circle at top,#2a002e,#000);
  color:#fff;
  overflow-x:hidden;
}
.hidden{display:none}
.center{display:flex;align-items:center;justify-content:center}
.btn{
  background:linear-gradient(135deg,var(--pink),#ff7abf);
  border:none;color:#fff;padding:14px 26px;
  border-radius:30px;font-size:16px;
  box-shadow:0 10px 30px rgba(255,79,154,.45);
  cursor:pointer;transition:.25s;
}
.btn:hover{transform:scale(1.06)}
.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  border-radius:24px;padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}

/* LOCK */
#lock{height:100vh}
#lock input{
  padding:14px 18px;border-radius:18px;border:none;
  outline:none;font-size:16px;width:220px
}

/* HERO */
#hero{min-height:100vh;text-align:center;padding:80px 18px}
#hero h1{font-size:42px;margin:0 0 10px;text-shadow:0 0 25px var(--pink)}
#hero p{opacity:.9}

/* HEARTS */
.heart{position:fixed;color:var(--pink);font-size:22px;pointer-events:none;animation:float 4s linear forwards}
@keyframes float{to{transform:translateY(-120vh) scale(1.5);opacity:0}}

/* SLIDESHOW */
#slideshow img{
  width:100%;max-width:320px;border-radius:20px;display:none
}
#slideshow img.active{display:block}

/* TYPEWRITER */
#letter{font-size:17px;line-height:1.7}

/* PROPOSAL */
#proposal h2{font-size:34px}
#yes{background:linear-gradient(135deg,#4caf50,#8bc34a)}
#no{background:#333}

/* FIREWORKS */
canvas{position:fixed;inset:0;pointer-events:none}

/* CAMERA */
video{width:260px;border-radius:18px}

footer{opacity:.6;font-size:13px;padding:30px 0}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- LOCK SCREEN -->
<section id="lock" class="center">
  <div class="card" style="text-align:center">
    <h2>🔒 Secret Gift</h2>
    <p>Enter her name</p>
    <input id="pwd" placeholder="Her name" />
    <br><br>
    <button class="btn" onclick="unlock()">Open 💖</button>
  </div>
</section>

<!-- HERO -->
<section id="hero" class="hidden">
  <h1>Forever Us 💕</h1>
  <p>A small digital surprise made with all my love</p>
  <button class="btn" onclick="music.play()">▶ Play Music</button>
</section>

<!-- SLIDESHOW -->
<section class="center" style="padding:40px">
  <div id="slideshow" class="card hidden">
    <h3>Our Memories 📸</h3>
    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e" class="active">
    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
  </div>
</section>

<!-- LETTER -->
<section class="center" style="padding:40px">
  <div class="card hidden" id="letterBox">
    <h3>For You 💌</h3>
    <p id="letter"></p>
  </div>
</section>

<!-- PROPOSAL -->
<section class="center" style="padding:40px">
  <div class="card hidden" id="proposal">
    <h2>Will you always stay with me? 🥹❤️</h2>
    <br>
    <button id="yes" class="btn" onclick="yesClick()">YES 💍</button>
    <button id="no" class="btn" onclick="alert('Aww 😅 try YES')">NO 🙈</button>
  </div>
</section>

<!-- CAMERA -->
<section class="center" style="padding:40px">
  <div class="card hidden" id="cameraBox">
    <h3>Our Selfie 📸</h3>
    <video id="cam" autoplay></video>
    <br><br>
    <button class="btn" onclick="openCam()">Open Camera</button>
  </div>
</section>

<footer class="center">Made with ❤️ just for you</footer>

<audio id="music" loop src="https://cdn.pixabay.com/audio/2023/03/13/audio_4cfe92c2c7.mp3"></audio>

<script>
const herName="ishika"; // change name
const lock=document.getElementById('lock');
const hero=document.getElementById('hero');
const slideshow=document.getElementById('slideshow');
const letterBox=document.getElementById('letterBox');
const proposal=document.getElementById('proposal');
const cameraBox=document.getElementById('cameraBox');
const music=document.getElementById('music');

function unlock(){
  if(pwd.value.toLowerCase()===herName){
    lock.classList.add('hidden');
    hero.classList.remove('hidden');
    slideshow.classList.remove('hidden');
    letterBox.classList.remove('hidden');
    proposal.classList.remove('hidden');
    cameraBox.classList.remove('hidden');
    startType();
    setInterval(spawnHeart,500);
    setInterval(nextSlide,2500);
  }else alert('Wrong name 😅');
}

/* Hearts */
function spawnHeart(){
  const h=document.createElement('div');
  h.className='heart';h.innerHTML='❤️';
  h.style.left=Math.random()*100+'vw';
  h.style.bottom='-20px';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4000);
}

/* Slideshow */
let idx=0;const imgs=document.querySelectorAll('#slideshow img');
function nextSlide(){imgs[idx].classList.remove('active');idx=(idx+1)%imgs.length;imgs[idx].classList.add('active');}

/* Typewriter */
const text="You are my safe place, my happiness, my forever. Every moment with you feels magical and I promise to keep choosing you, every single day. 💖";
let i=0;function startType(){setInterval(()=>{if(i<text.length){letter.innerHTML+=text.charAt(i++);}},50)}

/* YES fireworks */
const c=document.getElementById('fx'),x=c.getContext('2d');
function yesClick(){
  alert('YAYYY 🎆 I LOVE YOU');
  let t=0;const id=setInterval(()=>{
    x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,c.width,c.height);
    for(let i=0;i<30;i++){
      x.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
      x.fillRect(Math.random()*c.width,Math.random()*c.height,4,4);
    }
    if(t++>30)clearInterval(id);
  },50)
}
window.onresize=()=>{c.width=innerWidth;c.height=innerHeight};onresize();

/* Camera */
function openCam(){navigator.mediaDevices.getUserMedia({video:true}).then(s=>cam.srcObject=s)}
</script>
</body>
</html>
