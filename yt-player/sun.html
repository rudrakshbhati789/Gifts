<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are My Universe</title>

<style>
/* BASIC RESET */
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{background:#000;overflow:hidden;}

/* INTRO */
#intro{
    position:fixed;inset:0;
    background:radial-gradient(circle,#220022,#000);
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    z-index:9999;text-align:center;
    padding:10px;
}
#intro h1{
    color:#ff66ff;font-size:6vw;margin-bottom:20px;
    text-shadow:0 0 20px #ff00ff;
}
.heart{
    width:12vw;height:12vw;background:red;position:relative;
    transform:rotate(45deg);animation:beat 1s infinite;
}
.heart:before,.heart:after{
    content:"";width:12vw;height:12vw;background:red;
    border-radius:50%;position:absolute;
}
.heart:before{top:-6vw;left:0;}
.heart:after{left:-6vw;top:0;}
@keyframes beat{
    0%,100%{transform:scale(1) rotate(45deg);}
    50%{transform:scale(1.2) rotate(45deg);}
}
#enterBtn{
    margin-top:30px;padding:1vw 3vw;background:#ff33ff;
    color:#000;border:none;border-radius:1vw;font-size:4vw;
    cursor:pointer;box-shadow:0 0 1vw #ff55ff;
}
#enterBtn:hover{background:#ff99ff;}

/* UNIVERSE */
.universe{position:relative;width:100vw;height:100vh;}

/* SUN (WIFE) */
.sun{
    position:absolute;top:50%;left:50%;
    width:20vw;height:20vw;max-width:180px;max-height:180px;
    transform:translate(-50%,-50%);
}
.sun img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;
    box-shadow:0 0 3vw 1.5vw rgba(255,200,0,0.8);
    animation:spin 20s linear infinite;
}
@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* LOVE TEXT */
.loveText {
    position: absolute;
    top: 90%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff99ff;
    font-size:4vw;
    font-weight: 600;
    text-shadow: 0 0 2vw #ff00ff;
    animation: floatText 5s ease-in-out infinite;
    white-space: nowrap;
}

@keyframes floatText {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50% { transform: translate(-50%, -60%) scale(1.08); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* ORBITS */
.orbit{
    position:absolute;top:50%;left:50%;
    border-radius:50%;border:1px dashed rgba(255,255,255,0.2);
    transform:translate(-50%,-50%);
    animation:rotate linear infinite;
}
@keyframes rotate{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* PLANETS */
.planet img{
    width:12vw; max-width:110px;
    height:12vw; max-height:110px;
    border-radius:50%;object-fit:cover;
    box-shadow:0 0 2vw 1vw rgba(0,150,255,1);
}

/* Extra planets sizes */
.p1 img{width:8vw;height:8vw;max-width:80px;max-height:80px;box-shadow:0 0 1.5vw .8vw #ff4444;}
.p2 img{width:6vw;height:6vw;max-width:60px;max-height:60px;box-shadow:0 0 1.5vw .8vw #55ff55;}
.p3 img{width:5vw;height:5vw;max-width:50px;max-height:50px;box-shadow:0 0 1.5vw .8vw #7777ff;}

/* SHOOTING STARS */
.star{
    width:0.3vw;height:7vw;background:white;position:absolute;
    opacity:.7;filter:blur(0.1vw);transform:rotate(45deg);
    animation:fall 1.5s linear infinite;
}
@keyframes fall{
    from{transform:translateY(-100vh) translateX(0) rotate(45deg);}
    to{transform:translateY(100vh) translateX(20vw) rotate(45deg);}
}

/* MUSIC PLAYER */
#musicControls{
    position:fixed;bottom:2vw;left:2vw;z-index:10000;display:none;
}
button{
    background:#ff33ff;color:black;padding:1vw 2vw;border:none;
    margin-right:1vw;border-radius:1vw;cursor:pointer;
    box-shadow:0 0 1vw #ff55ff;
}
button:hover{background:#ff88ff;}

/* MEDIA QUERIES FOR SMALL SCREENS */
@media (max-width:600px){
    #intro h1{font-size:8vw;}
    #enterBtn{font-size:5vw;padding:2vw 4vw;}
    .loveText{font-size:5vw;}
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
    <h1>Welcome To Our Universe 💖</h1>
    <div class="heart"></div>
    <button id="enterBtn">Enter My World</button>
</div>

<!-- MUSIC PLAYER -->
<div id="musicControls">
    <button onclick="toggleMusic()">⏯ Play / Pause</button>
    <button onclick="nextSong()">⏭ Next</button>
</div>
<audio id="bgMusic"></audio>

<!-- UNIVERSE START -->
<div class="universe">

    <!-- WIFE / SUN -->
    <div class="sun">
        <img src="/gg/photos/9.jpeg">
    </div>

    <!-- YOUR LOVE TEXT -->
    <div class="loveText">Main hamesha tumhare aas-paas ghoomta rahunga ❤️</div>

    <!-- YOU (Your Planet) -->
    <div class="orbit" style="width:38vw;height:38vw;animation-duration:10s;">
        <div class="planet" style="position:absolute;top:50%;left:-5.5vw;transform:translateY(-50%);">
            <img src="/me/1.jpeg">
        </div>
    </div>

    <!-- EXTRA PLANET 1 -->
    <div class="orbit" style="width:50vw;height:50vw;animation-duration:16s;">
        <div class="planet p1" style="position:absolute;top:50%;left:-4vw;transform:translateY(-50%);">
            <img src="/me/2.jpeg">
        </div>
    </div>

    <!-- EXTRA PLANET 2 -->
    <div class="orbit" style="width:65vw;height:65vw;animation-duration:20s;">
        <div class="planet p2" style="position:absolute;top:50%;left:-3vw;transform:translateY(-50%);">
            <img src="/me/3.jpeg">
        </div>
    </div>

    <!-- EXTRA PLANET 3 -->
    <div class="orbit" style="width:80vw;height:80vw;animation-duration:25s;">
        <div class="planet p3" style="position:absolute;top:50%;left:-2.5vw;transform:translateY(-50%);">
            <img src="p3.png">
        </div>
    </div>

</div>

<script>
/* INTRO BUTTON */
document.getElementById("enterBtn").onclick = () => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("musicControls").style.display = "block";
    playMusic();
};

/* SHOOTING STARS */
function spawnStar(){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*innerWidth+"px";
    s.style.top="-50px";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
}
setInterval(spawnStar,300);

/* MUSIC PLAYER */
let songs=[
    "/a2/1.mp3",
    "/a2/2.mp3",
    "/a2/3.mp3",
    "/a2/4.mp3",
    "/a2/5.mp3",
];
let index=0;
let player=document.getElementById("bgMusic");

function playMusic(){
    player.src=songs[index];
    player.play();
}
function toggleMusic(){
    if(player.paused)player.play();
    else player.pause();
}
function nextSong(){
    index=(index+1)%songs.length;
    playMusic();
}
</script>

</body>
</html>
