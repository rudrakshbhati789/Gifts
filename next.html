<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love Universe</title>
<style>
/* ===================== GLOBAL ===================== */
body{
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle at center,#ff9bcf,#ff4f9e,#a90055);
    font-family:"Poppins",sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
}

/* ===================== TITLES ===================== */
h1{
    color:white;
    font-size:8vw;
    text-shadow:0 0 25px white;
    margin-top:2vh;
    opacity:0;
    animation:fadeIn 1.5s forwards;
}
@keyframes fadeIn{100%{opacity:1;}}

.couple-name{
    font-size:6vw;
    font-weight:700;
    text-align:center;
    background:linear-gradient(90deg,#ff4f9e,#ffb6c1,#ff69b4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:glow 2s infinite alternate;
}
@keyframes glow{
    from{ text-shadow:0 0 8px #ff4f9e;}
    to{ text-shadow:0 0 25px #ff69b4;}
}

.typewriter{
    font-size:5vw;
    font-weight:600;
    color:white;
    overflow:hidden;
    border-right:3px solid #fff;
    white-space:nowrap;
    width:0;
    animation:typing 3s steps(16) forwards, blink .7s infinite;
}
@keyframes typing{100%{width:16ch;}}
@keyframes blink{50%{border-color:transparent;}}

/* ===================== SLIDESHOW ===================== */
.slideshow{
    width:80vw;
    height:110vw;
    max-width:420px;
    max-height:560px;
    margin-top:2.5vh;
    position:relative;
    border-radius:20px;
    overflow:hidden;
    border:4px solid #ff4f9e;
    box-shadow:0 0 25px rgba(255,255,255,0.7);
    opacity:0;
    animation:popIn 1.6s forwards;
}
@keyframes popIn{to{opacity:1; transform:scale(1);}}
.slideshow img{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    opacity:0;
    transition:opacity 1s ease;
}

/* ===================== BUTTON ===================== */
.music-btn{
    margin-top:3vh;
    padding:12px 30px;
    border:none;
    border-radius:40px;
    color:white;
    font-size:5vw;
    background:linear-gradient(45deg,#ff2c8b,#ff6fb1);
    box-shadow:0 0 15px #ffb6d5;
    cursor:pointer;
}

/* ===================== FLOATING ELEMENTS ===================== */
.rose{
    position:absolute;
    font-size:2.6vw;
    opacity:0.8;
    animation:fall linear infinite;
}
@keyframes fall{
    0%{transform:translateY(-50px) rotate(0); opacity:0;}
    20%{opacity:1;}
    100%{transform:translateY(105vh) rotate(360deg); opacity:0;}
}

.heart{
    position:absolute;
    font-size:2.5vw;
    opacity:0.55;
    animation:floatUp 7s linear infinite;
}
@keyframes floatUp{
    from{transform:translateY(0) scale(1);}
    to{transform:translateY(-80vh) scale(1.5);}
}

.trail{
    position:fixed;
    font-size:16px;
    color:#ff1a75;
    pointer-events:none;
    opacity:1;
    transition:opacity .5s ease-out, transform .5s ease-out;
    text-shadow:0 0 20px #ff4f9e;
}

.sparkle{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:0.8;
}

/* ===================== RESPONSIVE ===================== */
@media(max-width:400px){
    h1{font-size:12vw;}
    .couple-name{font-size:8vw;}
    .typewriter{font-size:6vw;}
    .slideshow{width:90vw;height:120vw;}
}
</style>
</head>
<body>

<h1>My Love, My Universe ❤️</h1>
<div class="couple-name">Rudra ❤️ Ishika</div>
<div class="typewriter">I ❤️ U, Ishika</div>

<!-- SLIDESHOW -->
<div class="slideshow" id="slideBox">
    <img src="/gg/photos/1.jpeg">
    <img src="/gg/photos/2.jpeg">
    <img src="/gg/photos/3.jpeg">
    <img src="/gg/photos/4.jpeg">
    <img src="/gg/photos/5.jpeg">
    <img src="/gg/photos/6.jpeg">
    <img src="/gg/photos/7.jpeg">
    <img src="/gg/photos/8.jpeg">
    <img src="/gg/photos/9.jpeg">
    <img src="/gg/photos/10.jpeg">
</div>

<audio id="player" autoplay loop>
    <source src="/music/1.mp3">
</audio>
<button class="music-btn" onclick="changeMusic()">Change Music 🎵</button>

<script>
// ===================== SPARKLES =====================
for(let i=0;i<25;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    document.body.appendChild(s);
}

// ===================== FLOATING HEARTS =====================
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
},450);

// ===================== FALLING ROSES =====================
setInterval(()=>{
    const r=document.createElement("div");
    r.className="rose";
    r.innerHTML="🌹";
    r.style.left=Math.random()*100+"vw";
    r.style.animationDuration=(6+Math.random()*3)+"s";
    document.body.appendChild(r);
    setTimeout(()=>r.remove(),9000);
},850);

// ===================== SUPER TRAIL =====================
let last=0;
document.addEventListener("mousemove",(e)=>{
    const now=Date.now();
    if(now-last<40) return;
    last=now;
    createTrail(e.pageX,e.pageY);
});
document.addEventListener("touchmove",(e)=>{
    const t=e.touches[0];
    createTrail(t.pageX,t.pageY);
});
function createTrail(x,y){
    const t=document.createElement("div");
    t.className="trail";
    t.innerHTML="❤";
    t.style.left=x+"px";
    t.style.top=y+"px";
    document.body.appendChild(t);
    requestAnimationFrame(()=>{
        t.style.transform="scale(2)";
        t.style.opacity="0";
    });
    setTimeout(()=>t.remove(),500);
}

// ===================== SLIDESHOW =====================
const slides=document.querySelectorAll(".slideshow img");
let i=0;
function show(){
    slides.forEach((img,idx)=>{ img.style.opacity = idx===i?"1":"0"; });
    i=(i+1)%slides.length;
}
setInterval(show,2500);
show();

// ===================== MUSIC =====================
let list=["/a2/1.mp3","/a2/2.mp3","/a2/3.mp3","/a2/4.mp3"];
function changeMusic(){
    let p=document.getElementById("player");
    p.src=list[Math.floor(Math.random()*list.length)];
    p.play();
}
</script>

</body>
</html>
